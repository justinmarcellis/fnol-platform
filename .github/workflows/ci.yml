name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Test
        run: npm test
      - name: Quality report
        run: |
          if [ -f dashboard/quality-report.mjs ]; then node dashboard/quality-report.mjs; else echo "no quality report"; fi
