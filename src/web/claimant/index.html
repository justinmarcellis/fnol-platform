<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report a claim</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="Report an insurance claim online: guided questions or chat, add photos, and follow your claim status.">
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <a class="skip" href="#main" id="skip">Skip to main content</a>
  <fx-app-shell id="shell" product="Claims" home-href="/">
    <fx-demo-bar slot="demo"></fx-demo-bar>
    <div class="cl" id="cl" data-view="boot">
      <div class="cl-toolbar">
        <label class="ctl" id="tenant-wrap"><span id="tenant-label">Insurance company</span>
          <select id="tenant-picker"></select>
        </label>
        <label class="ctl" id="lang-wrap" hidden><span id="lang-label">Language</span>
          <select id="lang-picker"></select>
        </label>
      </div>
      <main id="main" tabindex="-1"><p class="cl-loading">Loading…</p></main>
    </div>
  </fx-app-shell>
  <p id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <noscript><p class="noscript">This page needs JavaScript. Please enable it to report a claim.</p></noscript>
  <script src="/runtime-config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
