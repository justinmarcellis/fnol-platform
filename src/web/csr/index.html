<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSR claims desk</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/csr/csr.css">
</head>
<body>
  <a class="fx-btn skip" href="#main" id="skip">Skip to main content</a>
  <fx-app-shell id="shell" product="Claims Desk" heading="CSR desk" home-href="/csr" user-role="csr">
    <fx-demo-bar slot="demo"></fx-demo-bar>
    <button slot="actions" class="fx-btn secondary" type="button" id="new-call" hidden></button>
    <main id="main" tabindex="-1">
      <div id="signin-prompt" class="fx-alert" data-tone="info" role="note" hidden>
        <div><strong id="signin-title"></strong><p id="signin-body"></p></div>
      </div>

      <div id="unavailable" class="fx-alert" data-tone="danger" role="alert" hidden>
        <div><strong id="un-title">Service unavailable</strong><p id="un-body"></p></div>
        <button class="fx-btn secondary small" type="button" id="un-retry">Retry</button>
      </div>

      <div id="desk" class="fx-stack" hidden>
        <fx-stepper id="stepper" current="0"></fx-stepper>

        <fx-card id="search-sec" heading="Find the caller's policy" padding="md">
          <form id="search-form" class="csr-searchbar" role="search" novalidate>
            <fx-field id="search-field" name="policy" label="Policy number" hint="" required></fx-field>
            <button class="fx-btn" type="submit" id="search-go">Search</button>
          </form>
          <p id="search-msg" class="csr-msg" role="status"></p>
          <div id="search-results" hidden>
            <fx-table id="search-table" caption="Policy results"></fx-table>
          </div>
          <p id="search-hint" class="muted"></p>
        </fx-card>

        <div id="intake-sec" class="csr-desk" hidden>
          <aside id="context-panel" class="csr-context" aria-labelledby="ctx-h">
            <fx-card id="ctx-card" heading="Caller's policy" padding="md">
              <button slot="actions" class="fx-btn ghost small" type="button" id="ctx-change"></button>
              <div id="ctx-body" class="fx-stack-sm"></div>
            </fx-card>
          </aside>

          <fx-card id="intake-card" heading="Assisted intake" padding="md" class="csr-intake">
            <div class="csr-progress" id="progress-wrap">
              <div class="csr-progress-head"><span class="fx-section-title" id="progress-h"></span><span id="progress-pct" class="fx-tabular"></span></div>
              <div class="csr-bar" id="progress-bar" role="progressbar" aria-labelledby="progress-h" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
              <p id="progress" class="muted" role="status"></p>
            </div>
            <div id="disclosures"></div>
            <div id="vehicle-pick" hidden></div>
            <div class="fx-alert csr-script" data-tone="info">
              <div><strong id="script-h"></strong><p id="script" aria-live="polite"></p></div>
            </div>
            <form id="answer-form" novalidate>
              <div id="answer-slot"></div>
              <p id="answer-optional" class="muted" hidden></p>
              <p class="fx-btn-group"><button class="fx-btn" type="submit" id="answer-go"></button> <button class="fx-btn secondary" type="button" id="answer-skip" hidden></button></p>
            </form>
            <button class="fx-btn" type="button" id="submit-go" hidden></button>
            <div class="csr-missing" aria-labelledby="panel-h">
              <h3 id="panel-h" class="fx-section-title"></h3>
              <ul id="missing"></ul>
              <p id="unlisted" class="muted"></p>
            </div>
          </fx-card>
        </div>

        <fx-card id="done-sec" heading="Claim submitted" padding="md" hidden>
          <div class="fx-stack-sm">
            <h3 id="done-h" tabindex="-1"></h3>
            <p id="done-number" class="fx-mono"></p>
            <p id="done-status"></p>
            <p id="done-note" class="muted" hidden></p>
            <p class="fx-btn-group"><a class="fx-btn" id="done-link" href="#"></a> <button class="fx-btn secondary" type="button" id="done-again"></button></p>
          </div>
        </fx-card>

        <fx-card id="recent-sec" heading="Recent claims" padding="none">
          <button slot="actions" class="fx-btn secondary small" type="button" id="recent-refresh"></button>
          <p id="recent-msg" class="csr-msg csr-recent-msg" role="status"></p>
          <fx-table id="recent-table" caption="Recent claims"></fx-table>
          <div slot="footer" id="recent-hint"></div>
        </fx-card>
      </div>

      <fx-card id="claim-sec" heading="Claim" padding="md" hidden>
        <div id="claim-msg" class="fx-alert" data-tone="warning" role="alert" hidden></div>
        <dl id="claim-dl" class="fx-kv"></dl>
        <p><a class="fx-btn secondary" id="claim-back" href="/csr"></a></p>
      </fx-card>
    </main>
  </fx-app-shell>
  <fx-toast id="toast"></fx-toast>
  <script src="/runtime-config.js"></script>
  <script type="module" src="/csr/app.js"></script>
</body>
</html>
