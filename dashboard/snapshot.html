<style>:root {
  --bg: #f5f6f8; --surface: #fff; --text: #1b2430; --muted: #5d6b7c; --border: #dde2e9;
  --accent: #2b6cb0; --good: #1f8a4c; --warn: #b7791f; --bad: #c53030;
  --good-bg: #e3f4ea; --warn-bg: #fbf0d9; --bad-bg: #fbe4e4; --chart2: #7b5ea7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161c; --surface: #1b212a; --text: #e6eaf0; --muted: #98a4b3; --border: #2d3643;
    --accent: #63a4e8; --good: #4cc27f; --warn: #e0a84a; --bad: #f07575;
    --good-bg: #17331f; --warn-bg: #382d14; --bad-bg: #3b1a1a; --chart2: #b39ddb;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px; max-width: 1200px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0; } h2 { font-size: 16px; margin: 0 0 10px; } h3 { font-size: 14px; margin: 0 0 6px; }
.sub, .muted { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.pill { font-size: 12px; padding: 2px 10px; border-radius: 99px; background: var(--good-bg); color: var(--good); white-space: nowrap; }
.pill.stale { background: var(--bad-bg); color: var(--bad); }
nav { display: flex; gap: 4px; overflow-x: auto; padding: 0 16px; max-width: 1200px; margin: 0 auto; border-bottom: 1px solid var(--border); }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 10px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
nav button[aria-selected=true] { color: var(--text); border-color: var(--accent); font-weight: 600; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 16px; }
.grid.wide { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.kpi .v { font-size: 26px; font-weight: 650; } .kpi .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--border); color: var(--text); }
.on-track, .good { background: var(--good-bg); color: var(--good); } .at-risk, .warn { background: var(--warn-bg); color: var(--warn); }
.off-track, .bad { background: var(--bad-bg); color: var(--bad); } .no-data { color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
.scroll { overflow-x: auto; }
.empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--border); border-radius: 8px; }
.board { display: grid; gap: 12px; grid-template-columns: repeat(6, minmax(190px, 1fr)); overflow-x: auto; padding-bottom: 8px; }
.col h3 { text-transform: capitalize; }
.tk { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 6px; padding: 8px; margin-bottom: 8px; font-size: 13px; }
.tk.blocked { border-left-color: var(--bad); background: var(--bad-bg); }
.tk b { display: block; } .tk .m { color: var(--muted); font-size: 12px; }
.filters { margin-bottom: 12px; } select { font: inherit; padding: 4px 8px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
svg { width: 100%; height: auto; display: block; } svg text { fill: var(--muted); font-size: 11px; }
.axis { stroke: var(--border); } .s1 { fill: var(--accent); stroke: var(--accent); } .s2 { fill: var(--good); stroke: var(--good); }
.line { fill: none; stroke-width: 2; } .ideal { stroke: var(--muted); stroke-dasharray: 4 3; fill: none; }
.legend { font-size: 12px; color: var(--muted); margin-top: 4px; } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 10px; }
.team { margin-bottom: 12px; } ul.plain { list-style: none; margin: 0; padding: 0; } ul.plain li { padding: 2px 0; }
@media (max-width: 600px) { .kpi .v { font-size: 22px; } main { padding: 12px; } }
ul { margin: 0 0 8px; padding-left: 18px; }
.stack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; margin-bottom: 10px; background: var(--border); }
.seg.c0 { background: var(--accent); } .seg.c1 { background: var(--good); } .seg.c2 { background: var(--chart2); } .seg.c3 { background: var(--warn); }
</style>

able}.js plus components/index.js, matching the KIT INTERFACE in the brief","tokens.css defines colors, spacing, type, radius as CSS custom properties with light and dark (prefers-color-scheme plus [data-theme]); theme.applyBranding maps public-config branding (name, primary color, logo url) to tokens and rejects non-hex colors","i18n has en and es tables with identical key sets (test asserts parity), param interpolation and fallback to en","api.js tests (node --test, fake fetch) cover bearer header, JSON envelope -> ApiError, network failure -> service_unavailable, upload; devlogin refuses when /health or config says production (devMode false) and posts tenant+role to /auth/token","Components are accessible by construction: labels tied to inputs, aria-live for toast and chat, role=list/progressbar semantics for stepper, keyboard operability for chips and table; file upload previews images with object URLs and revokes them","node --test --disable-warning=ExperimentalWarning tests/unit/web/shared/ passes"],"brief":"Build the shared kit and the UX flows doc. Read architecture/contracts/openapi.yaml for /auth/token (request/response), /config/public (PublicConfig schema: branding, lobs, locales) and the Error envelope; read core-runtime-api.md static serving: apps are served from src/web/\u003capp>/ and other paths resolve under src/web/, so apps reference the kit by absolute path /shared/....\n\nKIT INTERFACE (agreed now so apps build in parallel; S1-EXP-01 implements exactly this, apps import it): src/web/shared/api.js exports createApiClient({baseUrl='/api/v1', getToken, fetchImpl=fetch}) returning {get,post,put,patch,del,upload(path,FormData)} that return parsed JSON and throw ApiError {status,code,message,details,requestId} from the error envelope; network failure/5xx/404-on-missing-route throws ApiError with code 'service_unavailable'. src/web/shared/i18n.js exports t(key,params), setLocale, getLocale, registerStrings(locale,table), supportedLocales (en, es). src/web/shared/theme.js exports applyBranding(publicConfig), setScheme('light'|'dark'|'auto'). src/web/shared/devlogin.js exports devLogin(api,{tenant,role}) -> {token,principal}. Components are custom elements registered on import of src/web/shared/components/index.js: fx-field, fx-chips, fx-stepper, fx-upload, fx-chat, fx-timeline, fx-toast, fx-table. Each is attribute/property driven and emits CustomEvents named 'fx-change' (detail {value}) / 'fx-submit'. Shared CSS: src/web/shared/tokens.css and components.css. Apps put pure logic (state, view-models, API orchestration) in plain modules taking an injected api and t, so node tests need no DOM or kit.\n\nVanilla ES modules only, zero dependencies, no build step. Web components may use light DOM or shadow DOM, but expose form value via property and events; if shadow DOM, inherit tokens (custom properties pierce). Keep DOM-free logic (ApiError, interpolation, branding mapping, token validation, file-type checks) in importable functions so node tests run without a DOM; guard customElements/document access (typeof customElements !== 'undefined') so modules import cleanly in node. i18n must not touch window at import. Include keys the apps will need under namespaces common.*, kit.* (apps register their own claimant.*, csr.* tables via registerStrings, so do not add app strings). Dev login must only work when devMode is true; read it from GET /health or a flag the caller passes, and never store secrets. Colors must meet 4.5:1 contrast; focus ring 3:1; targets >= 24px (aim 44px on mobile). Pitfalls: do not edit package.json; no real carrier names or logos; write only your paths.","startedAt":"2026-10-18T20:38:15.956Z","doneAt":"2026-10-18T20:46:14.563Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T20:46:14.563Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria met; 25/25 tests pass (glob form; bare dir arg is a Node 22 limitation); in-scope files only, synthetic data, no PII logging"}],"firstPass":t  rendering by question type, without client-side showIf logic (server decides); back/edit of previous answer supported via re-answering","Conversational mode renders a chat transcript, accepts free-text answers, and displays AI-prefilled answers (as returned in the IntakeStep) with confirm/edit actions before they are accepted","After submit the page shows the claim number immediately, then an evidence upload step (photos/documents to POST /claims/{id}/documents) and a status page with timeline polling GET /claims/{id} (interval configurable, stops on terminal status, pauses when tab hidden)","If API calls fail with service_unavailable or the route is missing, the UI shows a clear 'service unavailable' state with retry, never a blank page or uncaught error","Spanish toggle appears only when the tenant public config lists es; selection persists and html lang updates","Mobile-first CSS (works at 320px), keyboard operable, focus moves to new question heading, aria-live announcements, skip link, reduced-motion respected","Tests in tests/unit/web/claimant/ with a fake api cover the guided state machine, conversational prefill confirmation, submit->upload->status flow, unavailable state, polling stop rule; node --test --disable-warning=ExperimentalWarning tests/unit/web/claimant/ passes"],"brief":"Build the claimant app under src/web/claimant/ against openapi.yaml; the backend may not exist yet, so all logic must tolerate failures.\n\nKIT INTERFACE (agreed now so apps build in parallel; S1-EXP-01 implements exactly this, apps import it): src/web/shared/api.js exports createApiClient({baseUrl='/api/v1', getToken, fetchImpl=fetch}) returning {get,post,put,patch,del,upload(path,FormData)} that return parsed JSON and throw ApiError {status,code,message,details,requestId} from the error envelope; network failure/5xx/404-on-missing-route throws ApiError with code 'service_unavailable'. src/web/shared/i18n.js exports t(key,params), setLocale, getLocale, registerStrings(locale,table), supportedLocales (en, es). src/web/shared/theme.js exports applyBranding(publicConfig), setScheme('light'|'dark'|'auto'). src/web/shared/devlogin.js exports devLogin(api,{tenant,role}) -> {token,principal}. Components are custom elements registered on import of src/web/shared/components/index.js: fx-field, fx-chips, fx-stepper, fx-upload, fx-chat, fx-timeline, fx-toast, fx-table. Each is attribute/property driven and emits CustomEvents named 'fx-change' (detail {value}) / 'fx-submit'. Shared CSS: src/web/shared/tokens.css and components.css. Apps put pure logic (state, view-models, API orchestration) in plain modules taking an injected api and t, so node tests need no DOM or kit.\nBecause the kit is built in parallel, import it by absolute path (/shared/...) only from browser-side files (index.html, app.js, views); keep pure logic modules (flow.js guided state machine, chat.js conversational controller, status.js polling controller, upload.js, strings.js registering claimant.* en/es via registerStrings) free of kit imports: they take injected {api, t, clock, timers}. Tests import only those pure modules and use a hand-written fake api returning IntakeStep-shaped objects (read IntakeStep and IntakeSession schemas for fields: question with id/type/prompt/options/help, prefilled, progress, done).\n\nFlow: auth: claimant dev token via devLogin (role claimant, selected tenant) in dev mode; start session {lob, channel:'web', locale}; loop answers; when question is null call submit with an Idempotency-Key header (crypto.randomUUID) and show the claim number from Claim.claimNumber; then upload evidence; then status page with fx-timeline from the claim's history/status. Polling: default 10s, stop on closed/denied/paid-type terminal statuses read from the Claim schema enum. Persist only language and tenant in localStorage wrapped in try/catch. Pitfalls: never trust client-side branching; escape all text (use textContent); do not store tokens in localStorage (memory/sessionStorage only); no real carrier names; write only your paths; run only your tests.","startedAt":"2026-10-18T20:38:25.428Z","review":{"reworkCount":1,"verdicts":[{"at":"2026-10-18T20:47:30.125Z","by":"qe-acceptance","verdict":"rework","reason":"Missing routes do not reach the 'service unavailable' state. Live server returns 404 {error:{code:'not_found'}} for POST /intake/sessions, but flow.isUnavailable only treats 404 as unavailable when code==='route_not_found', so the start screen shows a generic inline error with no retry. Tests use a fake that never matches the real server. Fix: treat 404 on the start call (and other non-session-scoped routes) as unavailable, and add a test using the real error shape. Everything else checked is fine: 22/22 tests pass, static files served, contract shapes match."},{"at":"2026-10-18T20:48:08.231Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria met; 24 tests pass; start-404 not_found now reaches unavailable+retry; server-driven showIf, idempotent submit, polling stop/pause, es toggle, a11y verified; in-scope paths only"}],"firstPass":false,"escapedDefects":[{"id":"DEF-S2-4","severity":"high","summary":"Claimant status polling throws Illegal invocation after submit (timers.setTimeout unbound)","foundIn":"S2-EXP-03"},{"id":"DEF-S2-5","severity":"medium","summary":"Claimant startSession never sends lossType; glass question set unreachable","foundIn":"S2-EXP-03"},{"id":"DEF-S2-6","severity":"low","summary":"Empty language picker visible for English-only tenants ([hidden] overridden by CSS)","foundIn":"S2-EXP-03"}]},"doneAt":"2026-10-18T20:48:08.231Z","spend":{"usd":1.2748,"inputTokens":92,"cacheWriteTokens":191828,"cacheReadTokens":3822493,"outputTokens":3068,"agents":{"a25a02f6ac7dacc40":{"label":"S1-EXP-02 review","model":"claude-sonnet-5-5","inputTokens":28,"cacheWriteTokens":51853,"cacheReadTokens":1097912,"outputTokens":157,"usd":0.3508},"a476f047d8d71b489":{"label":"S1-EXP-02 ic-experience-claimant-web-dev","mod p-10 risks ranked by likelihood x impact with mitigation, owner team and status (implemented/planned)","Multi-tenant isolation section analyses store rewriting limits (regex SQL rewrite, CTE/string-literal gaps from core-runtime-api.md assumptions), X-Tenant-Id handling, per-tenant keys, tctx binding and cache, with residual risks","AI-specific section covers prompt injection via uploaded documents, untrusted model output (schema validation, confidence/explanation, human review), data sent to providers (minimization, redaction, no-training terms, per-tenant opt-out) and provider failure","architecture/data-protection.md has a PII inventory table generated from x-pii fields in architecture/contracts/domain/*.schema.json (field, schema, handling), encryption at rest per tenant key via ctx.crypto.encryptPii/hmacIndex, key-management and rotation path to Cloud KMS, retention schedule, log redaction rules (ctx.log key list), and the synthetic-data-only rule","docs/compliance-mapping.md has tables mapping GLBA Safeguards Rule, NAIC #668, state claim-handling timelines (WI/IL/MI marked illustrative, how claims timers implement acknowledge/decide/pay deadlines) and SOC 2 CC6, CC7, CC8 to control -> evidence location (file or test path)","docs/security-overview.md is a customer-facing summary (\u003c=2 pages) with no internal-only detail, no real carrier names, and links to the other docs; claims not yet built are labelled planned","No secrets, real names or real carriers anywhere; only the four owned paths changed"],"brief":"Read architecture/overview.md first and enumerate its components and trust boundaries; build the STRIDE tables from that list so nothing is missed. Then read src/core/*.mjs and cite real behavior only: do not claim controls that are not in code. Mark gaps as 'planned' with an owning team. Known facts to use: tokens are HMAC-SHA256 dev tokens (auth.mjs) with key derived from master key; /api/v1/auth/token is dev-mode only; X-Tenant-Id only for platform_a {"at":"2026-10-18T21:19:02.797Z","from":"review","to":"done"}],"id":"S2-INT-02","team":"integrations","title":"KPI module with GET /api/v1/kpis","story":"As a supervisor or carrier admin I can see per-tenant operational KPIs tied to value drivers for a date range.","points":8,"tier":"mid","owner":"ic-integrations-reporting-dev","reviewer":"qe-acceptance","sprint":2,"paths":["src/modules/kpi/","tests/unit/kpi/"],"contracts":["architecture/contracts/modules.md","architecture/core-runtime-api.md","architecture/contracts/openapi.yaml"],"acceptance":["src/modules/kpi/index.mjs exports module {name:'kpi', migrations?, init, service(ctx), routes} following the module shape of src/modules/coverage/index.mjs; GET /api/v1/kpis?from&to returns {period:{from,to}, metrics:[{id,label,valueDriver,value,unit,numerator,denominator}]}; 400 on invalid dates or from>to; defaults to last 30 days","Metrics present with ids and drivers: stp_rate (VD-1), automated_capture_rate (VD-1), median_minutes_to_acknowledgment and median_minutes_to_assignment (VD-2), coverage_verified_at_intake_rate and fraud_flag_rate (VD-4), subrogation_flag_rate (VD-5), digital_self_service_share and spanish_session_share (VD-6), regulatory_timers_met and regulatory_timers_breached (VD-7)","Zero-denominator metrics return value null (not NaN) with numerator/denominator reported; medians return null when no data","Allowed roles supervisor, tenant_admin, carrier_admin, auditor; csr/adjuster/claimant get 403; results are computed only from the caller tenant (tenant isolation test with two tenants)","Computation reads data only via tenant-bound ctx.modules service functions or tenant-scoped reads of outbox; no PII in output; no writes","tests/unit/kpi/*.test.mjs pass with a fixture tenant (known counts and expected values for every metric) using small local fakes for claims/triage/routing/timers/outbox: node --test --disable-warning=ExperimentalWarning tests/unit/kpi/*.test.mjs"],"brief":"Build a new module src/modul failure category (severity bands, STP rules, undefined queue, other) for defect records","Only synthetic data; no files written outside listed paths"],"brief":"Start by running tests/e2e/scenarios.test.mjs and harness.test.mjs and grouping the 54 failing subtests by cause; read ADR-003 for the rule on tuning weights versus changing expectations. Expect four categories. (1) Severity bands off by about one band: inspect weights and cut-offs in src/modules/triage/ (score to band mapping must be 0-24/25-49/50-74/75-100); adjust weights or the injury/water factors, then re-run unit tests in tests/unit/triage/ and update them only if they encode the wrong values. Prefer fixing the weights over editing scenario expectations; edit an expectation only when the scenario is arguably wrong and add a one-line rationale. (2) Aurelia STP: add or fix rules in tenants/aurelia-mutual.json so glass-only auto claims and homeowners water damage with estimate under 2500 are fast-tracked; check the rule condition field names against the rules module and tenants/README.md. (3) Harness temp tenant e2e-demo (tests/e2e/harness.mjs) routes to an undefined queue: make src/modules/rules/ fall back to the tenant default queue when a matched rule has no queue, and make sure the harness tenant defines a default queue; add a unit test. (4) Commercial auto for Kestrel: add the commercial_auto question set and rules (commercial queue, fastTrack never true, including overriding any generic STP rule) in tenants/kestrel-point.json, extend tests/unit/config/demo-tenants.test.mjs for validation, and add or enable the commercial_auto_fleet_collision scenario in tests/e2e/scenarios.test.mjs. Pitfalls: other teams are editing other folders at once, so use only tenant-bound ctx APIs and do not touch package.json or src outside triage/rules; run only your own tests; do not commit. Post progress and any contract-change request to the integration/architecture hubs with --ticket S2-ITG-01.","valueDrivers":["VD-3"] 01","team":"platform","title":"Runtime: scheduler wiring, outbox sequence, smoke script in CI","story":"As an operator I want the app to own its scheduler, give event consumers a per-tenant ordering sequence, and prove end to end boot in CI.","points":5,"tier":"mid","owner":"ic-platform-runtime-dev","reviewer":"qe-acceptance","sprint":2,"paths":["src/server.mjs","src/core/bus.mjs","src/core/store.mjs","scripts/smoke.mjs",".github/workflows/ci.yml","tests/unit/core/scheduler-wiring.test.mjs","tests/unit/core/outbox-sequence.test.mjs","tests/unit/core/smoke.test.mjs"],"contracts":["architecture/core-runtime-api.md","architecture/contracts/modules.md"],"acceptance":["createApp exposes ctx.scheduler (createScheduler from src/core/scheduler.mjs) and app.close() calls scheduler.stopAll(); tests/unit/core/scheduler-wiring.test.mjs proves a registered job stops firing after close","outbox has a per-tenant monotonically increasing integer seq column added by a new migration (existing migrations untouched) that backfills existing rows in created_at,rowid order; bus.outbox(tenantId) rows include seq in ascending order; tests/unit/core/outbox-sequence.test.mjs covers two tenants interleaving, backfill on a pre-populated DB, and no seq reuse after delivery","scripts/smoke.mjs boots the app the way npm start does on a free port (PORT=0 or discovered), polls /healthz, issues tokens, creates one claim through the HTTP API end to end, asserts the response, and exits non-zero with a message on any failure; tests/unit/core/smoke.test.mjs runs it as a child process and asserts exit 0","CI runs node scripts/smoke.mjs after the Test step in .github/workflows/ci.yml","All existing tests in tests/unit/core pass unchanged: node --test --disable-warning=ExperimentalWarning tests/unit/core/*.test.mjs"],"brief":"Read architecture/core-runtime-api.md and src/server.mjs, src/core/bus.mjs, scheduler.mjs, store.mjs, scripts/dev.mjs first. (1) Scheduler: in createApp, build createScheduler() and set ctx.scheduler before modules mount so modules can register jobs; in close() call stopAll() before server.close and db.close. (2) Outbox seq: add a new entry to bus.mjs migrations (do not edit prior SQL). SQLite cannot add a NOT NULL autoincrement per tenant, so ALTER TABLE outbox ADD COLUMN seq INTEGER, backfill with a window function (ROW_NUMBER() OVER (PARTITION BY tenant_id ORDER BY created_at, rowid)), create UNIQUE INDEX on (tenant_id, seq). On publish compute seq = COALESCE(MAX(seq),0)+1 for the tenant inside the same transaction as the insert (check how store.mjs does transactions and tenant scoping; the tenant-scope guard rejects unscoped SQL, so use ctx.db.forTenant(id)). Never reuse seq after rows are deleted or delivered: rows are not deleted today, keep it that way or document. Order outbox() and replay by seq. Keep the store scope guard happy; if it needs a tweak, make the smallest change and note it. Also honor pending security asks only if trivial; do not expand scope. (3) scripts/smoke.mjs: zero deps, use fetch. Look at scripts/dev.mjs and tests/unit/core/server.test.mjs for token issuance (/auth/token with devMode) and a claim create route. Prefer spawning `npm start` equivalent (node scripts/dev.mjs) with PORT set to a free port found by listening on port 0, wait up to 15s for /healthz, always kill the child in finally, and exit 1 with a clear message on failure. Use a temp DB path so no repo files are polluted. (4) Add a ci.yml step 'Smoke' running node --disable-warning=ExperimentalWarning scripts/smoke.mjs after Test. Pitfalls: unref timers, test must not leave handles open, do not edit package.json (add no npm script; call the file directly). Synthetic data only.","valueDrivers":["reliability","time-to-deploy"],"requirements":["Scheduler owned by app lifecycle","Per-tenant ordered event stream for consumers","CI proves the app boots and processes a claim"],"startedAt":"2026-10-18T21:16:00.609Z","doneAt":"2026-10-18T21:19:39.614Z","review":{"r equired","infra/cloudrun/service.yaml is a Knative-style Cloud Run service (serving.knative.dev/v1) for project jmfnol-app-dev with run.googleapis.com/ingress: internal-and-cloud-load-balancing, serviceAccountName set to a runtime account created in infra/2-env/identities.tf (e.g. fnol-intake-api@jmfnol-app-dev.iam.gserviceaccount.com), secrets only via secretKeyRef from Secret Manager (no literal secret values), startup/liveness probes on /healthz, and devMode off","YAML parses: python3 -c 'import yaml,sys;yaml.safe_load(open(\"infra/cloudrun/service.yaml\"))' exits 0, and tests/unit/core/deployment-files.test.mjs (zero-dep text/structure assertions on all three files) passes via node --test --disable-warning=ExperimentalWarning tests/unit/core/deployment-files.test.mjs","docs/deployment.md explains how the PoC maps onto infra/ stages 0-bootstrap, 1-org, 2-env and which project and service account it uses; a production-changes section covers Cloud SQL or Firestore instead of SQLite, Cloud KMS instead of the local master key, Pub/Sub instead of the in-process bus (outbox as transactional publisher), and Secret Manager; and an exact ordered command list (gcloud auth, artifact registry repo create, docker build/push, secret creation, gcloud run services replace infra/cloudrun/service.yaml, verification) clearly marked as not run because no credentials exist"],"brief":"Read infra/README.md, infra/2-env/identities.tf (runtime accounts: fnol-\u003ckey> in the app project, keys include intake-api, gateway, etc.), infra/2-env/main.tf (project id pattern prefix-key-env so app project is jmfnol-app-dev), kms.tf, network.tf (Direct VPC egress), envs/dev.tfvars, src/server.mjs and scripts/dev.mjs (how the server starts, PORT, env vars such as master key and devMode; check src/core/crypto.mjs and auth.mjs for exact env var names and use them verbatim). Dockerfile: node:22-slim, WORKDIR /app, copy package*.json then run `npm ci --omit=dev --omit=optional` only if a lockfile exists (the core is zero-dependency; AI vendor SDKs are optionalDependencies, include them only if the server needs them at runtime, note the choice in docs), copy src, scripts, and other runtime dirs the server imports (verify by reading imports; web assets under src/web), USER node, HEALTHCHECK using `node -e fetch(...)`. Set a data dir under a writable path for SQLite and note it is ephemeral on Cloud Run. service.yaml: use annotations autoscaling.knative.dev/maxScale small, ingress annotation, vpc-access via run.googleapis.com/network-interfaces for Direct VPC egress referencing the env network/subnet names from network.tf, image placeholder REGION-docker.pkg.dev/jmfnol-app-dev/fnol/fnol-platform:TAG, env from secretKeyRef for the master key and signing secret. Deployment test: read files with node:fs, assert the key strings and the absence of anything resembling a literal secret; do not require a YAML library. Run the python yaml parse if python3 with yaml is available and report the result. No credentials, no real carrier names, do not run gcloud against anything. Do not touch package.json or any infra/*.tf.","valueDrivers":["time-to-deploy","security"],"requirements":["Container image build definition","Cloud Run manifest aligned with landing zone","Documented prod migration path and commands"],"startedAt":"2026-10-18T21:17:25.742Z","doneAt":"2026-10-18T21:20:01.456Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T21:20:01.456Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria met: Dockerfile/.dockerignore/service.yaml/deployment.md conform, YAML parses, 5/5 tests pass; no src changes so no regression gate"}],"firstPass":true},"spend":{"usd":0.3205,"inputTokens":24,"cacheWriteTokens":61081,"cacheReadTokens":753249,"outputTokens":1714,"agents":{"a5f13e1892bf6f0be":{"label":"S2-PLT-02 ic-platform-iac-engineer","model":"claude-sonnet-5-5","inputTokens":16,"cacheWriteTokens":40665,"cacheReadTokens":531207,"outputTokens":1650,"usd":0.2244},"a9d7 n.md"],"acceptance":["architecture/security-review-s2.md exists with a findings table: id (SEC2-NNN), severity (critical/high/medium/low/info), file:line, exploit scenario, fix, status","The review has a coverage section stating each of src/modules/{adjuster,claims,config,coverage,evidence,health,intake,integrations,rules,triage}, src/ai and src/web/shared/api.js was reviewed against each of the 8 checklist areas (tenant isolation, RBAC vs openapi x-roles, PII handling, prompt injection, webhook signature/SSRF, upload limits/content-type, error leakage, logging/events PII), with 'no finding' stated explicitly where clean","Every cited file:line exists and matches the described code (reviewer spot-checks at least 5)","Each high/critical finding has a test in tests/security/ named by finding id, written as t.todo (or test with todo option) so it fails when the todo is removed, and running node --test --disable-warning=ExperimentalWarning tests/security/ passes with no new failures","Each high/critical finding is posted to the incidents hub (node org/cli.mjs hub incidents shows one entry per finding id)","No files outside architecture/security-review-s2.md and tests/security/ are modified; no real names or secrets in the report"],"brief":"Read-only review of src/modules/*, src/ai/*, src/web/shared/api.js; you write only the report and new test files in tests/security/ (existing files there: helpers.mjs, tenant-isolation, pii-leak, roles, routes, audit-chain tests; reuse helpers.mjs and do not edit existing tests, add new files named sec2-\u003carea>.test.mjs). First read architecture/threat-model.md (risks R1-R3 already known: store rewrite bypass, devMode default true, cross-tenant row move; do not re-report as new, only cite whether still present), core-runtime-api.md (tenant-bound ctx addendum), contracts/modules.md and each module's openapi for x-roles and x-pii. Checklist per module: (1) tenant isolation: every DB access via tctx.db, no root ctx with tenant data, ctx.ai calls pass tenantId; grep for ctx.db, ctx.store, raw SQL string building, and tenant_id from request bodies; (2) RBAC: diff every registered route's roles against openapi x-roles, look for routes missing a role guard and object-level checks (IDOR across claims/evidence); (3) PII: x-pii fields encrypted at rest, not placed in event payloads, logs, errors or the AI inference log; (4) prompt injection: document/OCR text sent to providers must be delimited, schema-validated on output, and must not drive tool or privilege decisions; (5) webhooks: HMAC signature verification with constant-time compare and replay window, SSRF on target URLs (private/loopback/link-local/metadata ranges, redirects, DNS rebinding, non-http schemes); (6) uploads: size limits, content-type allowlist vs magic bytes, filename sanitization/path traversal; (7) error messages leaking stack traces, SQL, tenant ids or PII; (8) devMode/devlogin exposure. Verify each suspected finding by actually running a small script against the module (scratch dir only) before recording it; mark unverified ones 'suspected'. Severity: critical = cross-tenant data access or auth bypass, high = PII exposure, SSRF, RBAC gap on write routes. For each high/critical write one regression test that asserts the SECURE behaviour, wrapped as t.todo('SEC2-NNN: ...') so CI stays green. Post each via: AGENT_ID=ic-security-security-reviewer node org/cli.mjs post incidents incident '\u003cid> \u003cseverity> \u003cfile:line> \u003csummary>' --ticket S2-SEC-01. Pitfalls: line numbers drift, cite from the current tree; fixes are recommendations only, do not patch module code; if a contract is wrong, post a contract-change to architecture.","valueDrivers":["Insurer security due diligence","Tenant data isolation","PII and regulatory compliance"],"requirements":["Review covers all Sprint 1 modules","High/critical findings have failing regression tests as todos","High/critical findings posted to incidents hub"],"startedAt":"2026-10- chema.json","architecture/contracts/domain/PolicySnapshot.schema.json"],"acceptance":["src/web/csr/answers.js and a new src/web/claimant/structured.js (pure, no DOM) export buildStructured/coerce helpers; unit tests tests/unit/web/csr/structured.test.mjs and tests/unit/web/claimant/structured.test.mjs pass (node --test --disable-warning=ExperimentalWarning)","For question type party the CSR and claimant UIs render a sub-form (name, roles select incl. third_party/driver/witness, phone, optional insurer/policy no., at-fault flag) and POST answers with value as an object (not a string); type vehicle renders year/make/model/VIN/plate, type address renders street/city/state/postal; each sub-form has labelled controls and passes existing a11y checks","The server's 422 for an incomplete structured value is shown inline next to the sub-form","After policy selection both apps list the policy's vehicles (from GET /policies?q= summary or the coverage snapshot) and the chosen vehicle is sent as the insured vehicle answer including policyVehicleId and VIN so the claim carries vehicles[role=insured]; a policy with no vehicles hides the picker","tests/ui/csr.test.mjs has a Playwright test: CSR at Aurelia, rear-end personal_auto claim, other_party_involved=true, other driver party with at-fault, submit, then adjuster view (/adjuster) shows the subrogation flag/subrogation_review task; skips cleanly without Playwright","tests/ui/claimant.test.mjs covers a party sub-form and the vehicle picker in the claimant app","No edits outside owned paths; existing csr/claimant unit and UI tests still pass"],"brief":"Read src/web/csr/app.js, answers.js, assisted.js and src/web/claimant/{app,flow,chat,view}.js to see how a question becomes a control; today unknown types fall to a text fx-field and send a string. Server side (src/modules/intake/questions.js, mapping.js): types party/vehicle/address/location only require a non-null object value; mapping.js turns a party answer into parties[] with roles (default ['third_party']) and kind 'person', and a vehicle answer into vehicles[] with role 'insured'; unmapped fields pass through, so use Party/Vehicle schema field names (name {first,last}? check Party.schema.json, phone, roles array; Vehicle vin, year, make, model, policyVehicleId). Do not invent fields. Add answers-style pure helpers (CSR: extend answers.js coerceAnswer without breaking its existing tests; claimant: new structured.js) that map form-field values to the object, drop empty keys and set roles from a select; keep DOM rendering in app.js using the shared kit fx-* components already used (see existing fx-field usage). The Aurelia rule PR-SUBRO-AUTO fires on answers.other_party_involved == true and the question other_party_info (type party, requiredIf) must be answerable, so that is the demo path; the boolean answer must be sent as boolean true (coerceAnswer already does). For the insured vehicle: policy search (GET /policies?q=, {items,matchedOn}) returns PolicySummary with vehicleCount only; fetch the vehicle list from the policy snapshot / coverage endpoint exposed in openapi (check the coverage and policy routes there) when a policy is selected; if no endpoint lists vehicles for the role, post a contract-change to the architecture hub and fall back to reading the snapshot via the smallest compatible existing route, documenting it. Send the pick as the answer to the insured-vehicle (vehicle type) question if the tenant config has one, otherwise as the session-level vehicle the intake API accepts; verify via GET /claims/{id}?include=vehicles in the UI test. For UI tests reuse tests/ui/a11y-harness.mjs (launchBrowser, bootApp, answerCsrQuestion; extend only inside your own test files, harness is shared and read-only) and the adjuster URL/selectors from tests/ui/adjuster.test.mjs. Pitfalls: Idempotency-Key on claimant submit (existing); i18n strings go in strings.js for en and es; PII values never logged; use only synthetic data (names like Pat Example); [hidden] CSS rule for new controls; run only your own tests.","valueDrivers":["Faster, complete intake","Subrogation recovery","Coverage verification accuracy"],"requirements":["Party, vehicle and address questions answerable in both UIs","Insured vehicle carried on the claim from the policy","Aurelia subrogation flag reachable end to end from the CSR portal"],"startedAt":"2026-10-18T21:49:55.860Z","review":{"reworkCount":2,"verdicts":[{"at":"2026-10-18T21:57:44.618Z","by":"qe-acceptance","verdict":"rework","reason":"Insured-vehicle pick never reaches the claim on shipped tenants (server rejects insured_vehicle, error swallowed), and claimant picker is hidden with real claimant tokens; UI tests only prove the request/stub, not vehicles[role=insured]"},{"at":"2026-10-18T22:00:56.429Z","by":"qe-acceptance","verdict":"rework","reason":"Tests pass (94/94) but on shipped tenants insured_vehicle is rejected so claim has no vehicles[role=insured], and claimant picker stays hidden with real tokens; needs tenants personal_auto insured_vehicle question and claimant-readable vehicles source (plus Party.atFault) before criterion is met"},{"at":"2026-10-18T22:16:59.313Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria met; 91 web/UI tests pass incl. shipped-tenant Playwright picks and Aurelia subrogation path"}],"firstPass":false},"doneAt":"2026-10-18T22:16:59.314Z","spend":{"usd":2.8942,"inputTokens":182,"cacheWriteTokens":370911,"cacheReadTokens":9556287,"outputTokens":5537,"agents":{"a488cbc082117b397":{"label":"S4-EXP-01 review","model":"claude-sonnet-5-5","inputTokens":8,"cacheWriteTokens":20017,"cacheReadTokens":219315,"outputTokens":46,"usd":0.0944},"a564a5b45948a7d8c":{"label":"S4-EXP-01 review r2","model":"claude-sonnet-5-5","inputTokens":6,"cacheWriteTokens":24342,"cacheReadTokens":164740,"outputTokens":1001,"usd":0.1038},"a89b6855523e54b5b":{"label":"S4-EXP-01 ic-experience-csr-portal-dev","model":"claude-sonnet-5-5","inputTokens":92,"cacheWrite tegrations fixes: adapters must honour settings.fieldMapProfile so tenants get distinct mappings; webhook create/update must reject hosts outside notifications.webhooks.allowedHosts.","points":5,"tier":"mid","owner":"ic-integrations-adapter-dev","reviewer":"qe-acceptance","sprint":4,"paths":["src/modules/integrations/","tests/unit/integrations/"],"contracts":["architecture/contracts/modules.md","architecture/core-runtime-api.md"],"acceptance":["profileOf in src/modules/integrations/adapters/index.mjs reads settings.fieldMapProfile first, falls back to settings.profile alias, then default A; the tenants' values (mapping-a, mapping-b) are normalised to the adapter's profile ids (A/B)","New test in tests/unit/integrations/adapters/ shows aurelia-mutual and kestrel-point configs yield different mapped payloads for the same claim bundle; alias profile still works; unsupported value gives 422 invalid_adapter_settings","POST and PATCH/PUT /integrations/webhooks return 422 with a clear message naming the host when the URL host is not in notifications.webhooks.allowedHosts, using checkAllowedHost from webhooks/url-guard.mjs; allowed hosts still succeed","Tests in tests/unit/integrations/webhooks/service.test.mjs cover create deny, update deny, allow, and empty/missing allowedHosts behaviour","node --test --disable-warning=ExperimentalWarning tests/unit/integrations passes"],"brief":"Part 1: in src/modules/integrations/adapters/index.mjs (~line 75) profileOf reads settings.profile, but tenants/aurelia-mutual.json (~1358) and tenants/kestrel-point.json (~1181) set settings.fieldMapProfile ('mapping-a'/'mapping-b'), so everyone gets default A. Read fieldMapProfile first, keep profile as alias. Check what adapter.profiles contains and how adapter.map uses profile (adapters/*); add a small normaliser (mapping-a -> A, mapping-b -> B, case-insensitive, also accept bare A/B) rather than editing tenant files (not your paths). Keep the existing 422 invalid_adapter_settings behaviour for unknown values. Add a test using the two tenant configs (load the JSON from tenants/ read-only, or inline minimal fakes via existing fixtures.mjs / fake-core-authz pattern) and assert the mapped payloads differ; update golden tests only if they relied on the bug, and explain why. Part 2: src/modules/integrations/webhooks/service.mjs already has checkUrl calling checkAllowedHost (line ~83); first verify whether create AND update both call it (and the route layer in routes.mjs / any webhooks routes), and reproduce the reported gap with a test (check how the tenant config path notifications.webhooks.allowedHosts is read from ctx.tenant.config, devMode/loopback bypass, empty list semantics, wildcard handling in url-guard.mjs). Fix whichever path skips validation; error must be 422 (invalid_request style via invalid(ctx,...)) with message including the host. Do not weaken the delivery-time check in worker.mjs. Use helpers.mjs in tests/unit/integrations/webhooks. If a contract is wrong, post a contract-change to architecture hub and document it. Do not edit package.json or tenants/.","valueDrivers":["tenant-distinct field mapping","SSRF/egress control"],"requirements":["Adapter honours fieldMapProfile","Webhook target host allow-list enforced at create/update"],"startedAt":"2026-10-18T21:48:46.783Z","doneAt":"2026-10-18T21:52:48.588Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T21:52:48.588Z","by":"qe-acceptance","verdict":"accept","reason":"profileOf fieldMapProfile/alias/normalise verified, host-named 422 on create/update, 82 integration tests and e2e/security gate pass (0 fail)"}],"firstPass":true},"spend":{"usd":0.5778,"inputTokens":40,"cacheWriteTokens":115352,"cacheReadTokens":1346713,"outputTokens":1990,"agents":{"a2cf53e30c231f664":{"label":"S4-INT-01 review","model":"claude-sonnet-5-5","inputTokens":8,"cacheWriteTokens":24734,"cacheReadTokens":227929,"outputTokens":984,"usd":0.1173},"a665914bb52436931":{"label":"S4-INT-01 ic-integrations-adapter-dev","model":"claude-sonnet-5-5","inputTokens":18,"cacheWriteTokens":42503,"cacheReadTokens":645419,"outputTokens":919,"usd":0.2446},"a6ff287e78108ce1c":{"label":"S4-INT-01 security","model":"claude-sonnet-5-5","inputTokens":14,"cacheWriteTokens":48115,"cacheReadTokens":473365,"outputTokens":87,"usd":0.2159}}}},{"id":"S4-PLT-00","team":"platform","title":"Sprint 4 planning: PLT","points":1,"tier":"mid","owner":"mgr-platform","reviewer":"ceo","status":"done","sprint":4,"dependsOn":[],"createdAt":"2026-10-18T21:47:22.316Z","history":[{"at":"2026-10-18T21:48:35.689Z","from":"ready","to":"review"},{"at":"2026-10-18T22:20:55.134Z","from":"review","to":"done"}],"paths":["org/board/tickets/"],"acceptance":["Disjoint, parallel, testable tickets"],"spend":{"usd":0.1095,"inputTokens":8,"cacheWriteTokens":21898,"cacheReadTokens":220570,"outputTokens":1061,"agents":{"a17db73a948a2589a":{"label":"S4-PLT-00 mgr-platform planning","model":"claude-sonnet-5-5","inputTokens":8,"cacheWriteTokens":21898,"cacheReadTokens":220570,"outputTokens":1061,"usd":0.1095}}},"doneAt":"2026-10-18T22:20:55.134Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T22:20:55.133Z","by":"ceo","verdict":"accept","reason":"Plan executed"}],"firstPass":true}},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T21:48:35.636Z","history":[{"at":"2026-10-18T21:48:49.065Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T21:49:13.772Z","from":"in_progress","to":"review"},{"at":"2026-10-18T21:52:39.891Z","from":"review","to":"done"}],"id":"S4-PLT-01","team":"platform","title":"Seed-once tenant loading with seedVersion","story":"Tenant seeding must not overwrite console edits: boot re-puts every tenants/*.json so an admin-console change is lost on restart.","points":3,"tier":"mid","owner":"ic-platform-tenancy-dev","reviewer":"qe-acceptance","sprint":4,"paths":["src/core/tenants.mjs","tests/unit/core/tenants.test.mjs","docs/setup.md"],"contracts":["architecture/core-runtime-api.md","architecture/contracts/modules.md"],"acceptance":["loadDir() puts a tenants/*.json file only when the tenant has no stored config, or when the file's top-level seedVersion (missing = 0) is greater than the stored config's seedVersion (missing = 0)","A tenant whose stored config was changed via put() (e.g. console edit) is NOT overwritten on a later loadDir() when the file seedVersion is not greater; a higher file seedVersion does overwrite","loadDir() logs per tenant whether it was applied (new / seedVersion upgrade) or skipped (kept stored config), and still returns the list of tenant ids present (applied or skipped) so existing callers keep working","docs/setup.md documents seed-once semantics, the seedVersion field, how to force a re-seed by bumping it, and that npm run demo:reset wipes data/ and therefore reseeds from files","New tests in tests/unit/core/tenants.test.mjs cover: first boot, restart with console edit preserved, seedVersion bump applied, missing seedVersion treated as 0, invalid file still rejected; run: node --test --disable-warning=ExperimentalWarning tests/unit/core/tenants.test.mjs","All existing core tests stay green (tests/unit/core/*.test.mjs that touch tenants, e.g. server.test.mjs, tenant-context.test.mjs)"],"brief":"Edit loadDir() in src/core/tenants.mjs (about line 73). For each file: parse JSON, id = config.id ?? basename. Read stored = latest(id). Decide: apply if no stored row; else apply if Number(config.seedVersion ?? 0) > Number(parse(stored.config).seedVersion ?? 0); else skip. Use db.parseJson(stored.config). Apply via api.put(id, config, 'boot'); put already no-ops when identical, so a bump with identical content is fine. Log with ctx.log if present (check src/core/log.mjs and core-runtime-api.md for the logger shape; guard with optional chaining since loadDir may run before the logger is wired in tests), e.g. 'tenant seed applied' / 'tenant seed skipped' with {tenantId, reason, fileSeedVersion, storedSeedVersion}. Do not log config contents. Keep returning all ids. A console edit that goes through put() keeps the stored config's seedVersion only if the editor preserves the field; if an edit drops it, stored is treated as 0, so a file with seedVersion >= 1 would re-apply: document this and note that console edits should carry seedVersion forward (do not change other files; if the admin console strips it, post a note to the architecture hub with node org/cli.mjs post architecture contract-change). Do not add seedVersion to tenants/*.json (not your paths; absent equals 0 and that is fine) and do not edit package.json. Tests: build ctx via the helper in tests/unit/core/helpers.mjs, write temp tenants dir with os.tmpdir, create tenants twice over the same DB to simulate restart. Validators: register none or a minimal one; check how existing tests construct createTenants. Only write your three paths; run only your test file plus the core tests that touch tenants.","valueDrivers":["Admin console edits survive restarts","Safe, explicit config upgrades for licensed insurers"],"requirements":["Seed-once tenant loading","seedVersion upgrade path","demo:reset reseed documented"],"startedAt":"2026-10-18T21:48:49.065Z","doneAt":"2026-10-18T21:52:39.891Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T21:52:39.891Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria met; 11 tenant/server/context tests pass; e2e+security 382 tests, 0 fail (no new failures vs baseline); no config contents logged"}],"firstPass":true},"spend":{"usd":0.444,"inputTokens":24,"cacheWriteTokens":113325,"cacheReadTokens":636546,"outputTokens":3337,"agents":{"a0ab59819f39dcc7b":{"label":"S4-PLT-01 ic-platform-tenancy-dev","model":"claude-sonnet-5-5","inputTokens":12,"cacheWriteTokens":25595,"cacheReadTokens":352697,"outputTokens":917,"usd":0.1437},"a1e623e6b602644d8":{"label":"S4-PLT-01 review","model":"claude-sonnet-5-5","inputTokens":8,"cacheWriteTokens":24094,"cacheReadTokens":228842,"outputTokens":878,"usd":0.1148},"ab2e5342f8 tor named in openapi x-roles; config routes accept carrier_admin as tenant_admin equivalent. Also tenant_configs table is owned by core (ctx.tenants), so config has no own migration. TenantConfig.timers[].state is a UsState, so 'timers reference known states' is checked against LOB states plus stopOn.toStatus against lifecycle states.","from":"ic-workflow-domain-modeler","ticket":"S1-WFL-01"},{"at":"2026-10-18T20:44:36.873Z","hub":"architecture","type":"contract-change","text":"CSR portal: (1) openapi has no policy search route; using GET /policies/{policyNumber}/snapshot?asOf (exact lookup, 0-1 results). Request optional GET /policies?q= for real search. (2) IntakeStep gives only progress.requiredRemaining; request optional additive IntakeStep.missing[] ({questionId,text}); CSR derives from seen questions until then. (3) Channel enum has csr_phone, not 'csr'; CSR uses csr_phone. (4) shared api.post() ignores headers so Idempotency-Key needs a wrapper client (platform/experience kit).","from":"ic-experience-csr-portal-dev","ticket":"S1-EXP-03","link":"architecture/contracts/openapi.yaml"},{"at":"2026-10-18T20:45:39.593Z","hub":"architecture","type":"contract-change","text":"integrations: openapi x-roles use tenant_admin/auditor but ROLES in core auth has carrier_admin and no tenant_admin/auditor; webhook routes accept [tenant_admin, carrier_admin] so both work. Suggest aligning role names in openapi.yaml or core ROLES.","from":"ic-integrations-webhook-dev","ticket":"S1-INT-02","link":"architecture/contracts/openapi.yaml"},{"at":"2026-10-18T20:45:39.667Z","hub":"architecture","type":"contract-change","text":"integrations: core outbox table has no sequence column (modules.md says it does). GET /integrations/outbox derives sequence as 1-based position via ctx.bus.outbox and prefers a core 'sequence' field if added. Request: platform adds outbox.sequence (per-tenant monotonic) and a limit/after option on bus.outbox.","from":"ic-integrations-webhook-dev","ticket":"S1-INT-02","link":"architecture/contracts/modules.md"},{"at":"2026-10-18T20:50:24.580Z","hub":"architecture","type":"contract-change","text":"rules 1.0 clarifications: (1) validateRules and evaluateCondition are synchronous (config needs sync); evaluate/route/buildFacts/getRoutingDecision async. (2) Routing precedence: first route_queue in ascending priority wins (seeded priority-90 default rules would otherwise override injury/SIU); approved fast track beats default queues; deny_fast_track beats fast_track; fast track also requires coverage.outcome=covered and tenant fastTrack limits. (3) additive route() opts sourceEventId/auto and service fn onClaimTriaged(evt); routing_decisions gains seq, source_event_id, actions, actions_done. (4) answers fact comes from intake.getSession(claim.intakeSessionId).answers when available, else claim.answers. Please update modules.md domain-model.md section 4 'last route_queue wins'.","from":"ic-workflow-rules-engine-dev","ticket":"S1-WFL-02","link":"src/modules/rules/"},{"at":"2026-10-18T20:53:13.539Z","hub":"architecture","type":"contract-change","text":"AdjusterView schema has no header/flags/nextBestActions keys (additionalProperties:false). Implemented as claim (header) with derived flags merged into claim.flags, and nextActions (items also carry priority, source). ai.run returns tier as AiProvenance integer (0 local,1 cheap,2 strong) plus tierName; tenant comes from opts.tenantId (ctx.ai is root-bound) or ai.forTenant(id). Task 'next_question' (intake/openapi) is not one of the 8 tasks and throws validation_error. adjuster_inbox gains additive columns claim_number, lob, complexity, next_timer, reported_at.","from":"ic-ai-summarization-engineer","ticket":"S1-AI-01"},{"at":"2026-10-18T20:53:20.951Z","hub":"architecture","type":"contract-change","text":"claims: additive event claim.updated {claimId, change, version, ...ids} published for mutations with no dedicated event (flag, task, external ref, reserve, routing/checks/triage updates from events, timer started/met/cancelled). Also service additions applyEvent/applyTimerEvent/sweepTimers(now). Seeded onBreach add_task type timer_breach_followup and stopOn taskType acknowledge_claimant are outside the Task.type enum: stored as 'other' with the requested type kept for timer matching.","from":"ic-workflow-timers-dev","ticket":"S1-WFL-03","link":"src/modules/claims/service.mjs"},{"at":"2026-10-18T20:54:26.974Z","hub":"architecture","type":"contract-change","text":"evidence: (1) Document.extraction gains optional boolean needsReview (status 'partial' + needsReview=true for unreadable PDFs / low-confidence photos). (2) openapi x-roles lists 'auditor' but core auth ROLES has no auditor, so tokens cannot carry it. (3) Upload limit is 10 MB (413), allowed types jpeg/png/webp/heic/gif/pdf/text-plain (415).","from":"ic-ai-extraction-engineer","ticket":"S1-AI-03"},{"at":"2026-10-18T20:56:38.679Z","hub":"architecture","type":"contract-change","text":"intake additive: POST /intake/sessions/{id}/narrative {text}->IntakeStep; IntakeStep gains prompt, locale, optional[] (unanswered optional questions; question stays null when only optional remain), blocked[]; answer item accepts provenance 'ai_extraction' to confirm a pending suggestion; 422 answer response is {error,...IntakeStep}; roles claimant/csr/agent/integration/carrier_admin; tenant sample questions use mapsTo 'loss.*' (accepted as alias of lossEvent.*)","from":"ic-workflow-intake-flow-dev","ticket":"S1-WFL-04","link":"architecture/contracts/openapi.yaml"},{"at":"2026-10-18T20:58:00.381Z","hub":"architecture","type":"contract-change","text":"triage: TriageResult.subrogation (additionalProperties:false) lacks 'confidence'; ticket S1-AI-04 needs {flag,reasons,confidence}. Implemented as additive subrogation.confidence (0-1); please add to TriageResult.schema.json. Also: severityBand names follow the schema (minor/moderate/major/severe); AI fraud weights in points are normalized to 0-1; triage_results gains additive columns input_hash, source_event_id; prior-claims count is read from bundle.priorClaimsCount/priorClaims[]/accepted fact priorClaims (no contract source yet); triage service adds onEvent(kind, evt).","from":"ic-ai-fraud-signals-engineer","ticket":"S1-AI-04","link":"src/modules/triage/"},{"at":"2026-10-18T20:59:13.176Z","hub":"architecture","type":"contract-change","text":"tenant_admin is used in openapi x-roles (webhooks) and integrations routes but is not in src/core/auth.mjs ROLES, so no token can be minted for it; tests skip those routes. Also GET /claims/{id}/documents returns 200 {items:[]} for unknown claim (no leak; evidence team may prefer 404).","from":"ic-security-authz-engineer","ticket":"S1-SEC-02"},{"at":"2026-10-18T21:04:07.144Z","hub":"architecture","type":"answer","from":"ceo","text":"Roles: core now issues tenant_admin and auditor per openapi; POST /auth/token returns 201 {token, expiresAt, principal} and accepts userId/displayName; GET /audit roles per contract"},{"at":"2026-10-18T21:10:49.205Z","hub":"architecture","type":"contract-change","text":"Coverage 1.2.0 additive: GET /api/v1/policies?q= (roles csr,agent,adjuster,supervisor) -> {items: PolicySummary[], matchedOn}; PolicySummary = {policyNumber,lob,status,period,riskState,insuredName,contact:{phone:'***-***-0101',postalCode:'606**'},description,vehicleCount,propertyCount}; service.searchByQuery(q), searchPolicies accepts policyNumberPrefix; commercial_auto rules (fleet units w/ addedDate/removedDate, HNOA via vehicle role/ownership hired|non_owned, cargo needs CARGO endorsement+coverage via facts.cargoInvolved / lossEvent.cargoInvolved). Please add PolicySummary to openapi.yaml and /policies path; no cargo LossCause exists in common schema so cargo is a flag","from":"ic-integrations-mock-pas-dev","ticket":"S2-INT-01","link":"src/modules/coverage/routes.mjs"},{"at":"2026-10-18T21:12:17.254Z","hub":"architecture","type":"contract-change","text":"kpi 1.0: GET /api/v1/kpis?from&to is not in openapi.yaml. Response {period:{from,to}, metrics:[{id,label,valueDriver,value|null,unit(ratio|minutes),numerator|null,denominator|null,definition,note?}], truncated?}; roles supervisor,tenant_admin,carrier_admin,auditor; 400 bad_request on invalid dates/from>to; default last 30 days. No claim.acknowledged event exists: ack time = that event if a tenant emits it, else acknowledge timer metAt. Please add path + kpi to modules.md","from":"ic-integrations-reporting-dev","ticket":"S2-INT-02","link":"src/modules/kpi/"},{"at":"2026-10-18T21:15:38.694Z","hub":"architecture","type":"contract-change","text":"S2-AI-01: guardrails are built but not wired. To route every provider call through them, src/ai/index.mjs (AI team) should pass providers through guardProviders(...) from src/ai/guardrails.mjs, and cascade getProvider should wrap lazily loaded providers with guard(p, undefined, {log, tenantId}). Guarded run() never throws; on invalid output or oversize it returns {refusal:true,error}, which the cascade already treats as a skip. Cloud is any provider whose locality/kind is not 'local' (falls back to name !== 'local'); providers need no change.","from":"ic-ai-eval-engineer","ticket":"S2-AI-01","link":"src/ai/guardrails.mjs"},{"at":"2026-10-18T21:17:18.653Z","hub":"architecture","type":"contract-change","text":"evidence/adjuster hardening: (1) AdjusterView (additionalProperties:false) gains additive top-level 'timestamps' {reportedAt, acknowledgedAt, assignedAt}; Claude/AdjusterView schemas are closed so please add it. ackAt = claim.acknowledged event else acknowledge timer metAt; assignedAt = routing.decidedAt when assigned/fast_tracked. (2) summary gains citedFacts [{name,value}] and text ends with a 'Facts used:' line (schema summary is open). (3) TenantConfig is closed: evidence upload cap read from optional config.evidence.maxUploadBytes (default 10 MB); please add to TenantConfig.schema.json. (4) Evidence now sniffs magic bytes; declared/actual mismatch is 415 n in the claims ticket from Sprint 1 (REQ-12 says instant)"]}},{"number":3,"name":"Sprint 3: harden and document","status":"closed","goal":"Close all 7 high security findings and 4 UI defects; prove the PoC definition of done per LOB; configuration guide, demo script, COTS readiness","review":{"shipped":["All 7 Sprint 2 high security findings fixed with real regression tests (security suite 175 pass / 0 fail)","Security gate (IMP-9) caught and fixed a new high (SEC3-001) within the sprint","4 UI defects fixed and verified in Chromium","Definition-of-done test per LOB incl. signed webhook + core adapter; tenant-differences test","Demo data on first start; configuration guide, 10-minute demo script, COTS readiness assessment, docs index"],"risks":["Demo rehearsal found 4 product gaps + 2 bugs (UI claims cannot reach coverage/fast-track; adapter profile key; config overwritten at boot): Sprint 4","6 SEC3 mediums open","GCP deployment still blocked on credentials"],"completedPoints":87,"committedPoints":87,"usd":17.58,"pointsPerDollar":4.9,"firstPassAcceptance":0.909,"reworkRate":0.091,"testPassRate":0.9892,"testsPassed":"1192/1205"},"retro":{"went_well":["Security gate found a high the acceptance reviewer missed, and the rework loop fixed it in-sprint","A docs agent that rehearsed the demo against the running system found real product gaps that unit and e2e tests did not","IC refused to weaken a security control to make tests pass and escalated instead (S3-INT-02)"],"went_badly":["A correct fix (estimate totals) regressed severity calibration because AI tiers and triage tiers are duplicated across team boundaries","Gate findings JSON captured pre-rework state, so a fixed high was reported Open","Sprint 3 needed an orchestrator-dispatched follow-up wave"],"manager_retros":["product: rehearsing the demo should happen in Sprint 2, not Sprint 3","quality: DoD test needed GET /claims after submit because submit returns a summary; contract says full Claim","integration: dupl
