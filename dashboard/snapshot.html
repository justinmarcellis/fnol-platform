<style>:root {
  --bg: #f5f6f8; --surface: #fff; --text: #1b2430; --muted: #5d6b7c; --border: #dde2e9;
  --accent: #2b6cb0; --good: #1f8a4c; --warn: #b7791f; --bad: #c53030;
  --good-bg: #e3f4ea; --warn-bg: #fbf0d9; --bad-bg: #fbe4e4; --chart2: #7b5ea7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161c; --surface: #1b212a; --text: #e6eaf0; --muted: #98a4b3; --border: #2d3643;
    --accent: #63a4e8; --good: #4cc27f; --warn: #e0a84a; --bad: #f07575;
    --good-bg: #17331f; --warn-bg: #382d14; --bad-bg: #3b1a1a; --chart2: #b39ddb;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px; max-width: 1200px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0; } h2 { font-size: 16px; margin: 0 0 10px; } h3 { font-size: 14px; margin: 0 0 6px; }
.sub, .muted { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.pill { font-size: 12px; padding: 2px 10px; border-radius: 99px; background: var(--good-bg); color: var(--good); white-space: nowrap; }
.pill.stale { background: var(--bad-bg); color: var(--bad); }
nav { display: flex; gap: 4px; overflow-x: auto; padding: 0 16px; max-width: 1200px; margin: 0 auto; border-bottom: 1px solid var(--border); }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 10px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
nav button[aria-selected=true] { color: var(--text); border-color: var(--accent); font-weight: 600; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 16px; }
.grid.wide { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.kpi .v { font-size: 26px; font-weight: 650; } .kpi .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--border); color: var(--text); }
.on-track, .good { background: var(--good-bg); color: var(--good); } .at-risk, .warn { background: var(--warn-bg); color: var(--warn); }
.off-track, .bad { background: var(--bad-bg); color: var(--bad); } .no-data { color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
.scroll { overflow-x: auto; }
.empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--border); border-radius: 8px; }
.board { display: grid; gap: 12px; grid-template-columns: repeat(6, minmax(190px, 1fr)); overflow-x: auto; padding-bottom: 8px; }
.col h3 { text-transform: capitalize; }
.tk { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 6px; padding: 8px; margin-bottom: 8px; font-size: 13px; }
.tk.blocked { border-left-color: var(--bad); background: var(--bad-bg); }
.tk b { display: block; } .tk .m { color: var(--muted); font-size: 12px; }
.filters { margin-bottom: 12px; } select { font: inherit; padding: 4px 8px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
svg { width: 100%; height: auto; display: block; } svg text { fill: var(--muted); font-size: 11px; }
.axis { stroke: var(--border); } .s1 { fill: var(--accent); stroke: var(--accent); } .s2 { fill: var(--good); stroke: var(--good); }
.line { fill: none; stroke-width: 2; } .ideal { stroke: var(--muted); stroke-dasharray: 4 3; fill: none; }
.legend { font-size: 12px; color: var(--muted); margin-top: 4px; } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 10px; }
.team { margin-bottom: 12px; } ul.plain { list-style: none; margin: 0; padding: 0; } ul.plain li { padding: 2px 0; }
@media (max-width: 600px) { .kpi .v { font-size: 22px; } main { padding: 12px; } }
ul { margin: 0 0 8px; padding-left: 18px; }
.stack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; margin-bottom: 10px; background: var(--border); }
.seg.c0 { background: var(--accent); } .seg.c1 { background: var(--good); } .seg.c2 { background: var(--chart2); } .seg.c3 { background: var(--warn); }
</style>
</head>

-15"],"startedAt":"2026-10-18T20:46:06.044Z","doneAt":"2026-10-18T20:56:07.715Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T20:56:07.715Z","by":"qe-acceptance","verdict":"accept","reason":"All 20 tests pass; cascade, hashed tenant-scoped inference log, AdjusterView validation, summary cache, inbox and routes meet criteria"}],"firstPass":true}},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T20:35:12.568Z","history":[{"at":"2026-10-18T20:48:37.052Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:51:12.329Z","from":"in_progress","to":"review"},{"at":"2026-10-18T20:55:49.770Z","from":"review","to":"done"}],"team":"ai","reviewer":"qe-acceptance","sprint":1,"id":"S1-AI-02","title":"Local and Vertex AI providers","story":"AI layer (REQ-25) providers","points":8,"tier":"mid","owner":"ic-ai-provider-integrator","paths":["src/ai/providers/","tests/unit/ai/providers/","tests/fixtures/ai/"],"contracts":["architecture/overview.md#ai","architecture/contracts/domain/Document.schema.json","architecture/contracts/domain/common.schema.json"],"acceptance":["src/ai/providers/local.mjs implements all 8 tasks deterministically; node --test tests/unit/ai/providers/local.test.mjs passes on fixtures in tests/fixtures/ai/ (police report text, repair estimate text, rear-end narrative, injury narrative, glass-only narrative, theft w/o police report) asserting extracted fields and confidence","local output shapes match the shared task I/O shapes in the brief","vertex-claude.mjs uses AnthropicVertex({projectId,region:'global'}), tier models claude-haiku-5-5/claude-sonnet-5-5/claude-opus-5-5, thinking {type:'adaptive'}, output_config json_schema, no tool_choice, no budget_tokens; checks stop_reason==='refusal' before reading content; node --test tests/unit/ai/providers/vertex.test.mjs passes with injected fake SDK clients","vertex-gemini.mjs uses GoogleGenAI({vertexai:true,project,location}) with responseSchema JSON; available() false (no throw) when SDK import fails or GOOGLE_CLOUD_PROJECT missing","grep shows no real carrier names, no secrets, no budget_tokens"],"brief":"Each provider file default-exports a factory (ctx,opts)=>{name,available(),run(task,input,{tier,schema})} returning {output,confidence,explanation,usage,model} or {refusal:true}. S1-AI-01 consumes these; do not edit src/ai/index.mjs. Local (src/ai/providers/local.mjs, may split into src/ai/providers/local/*.mjs): regex/keyword/heuristics: police report number, cited party/at-fault party, loss date, VIN, estimate total, repair shop, damage areas; narrative cues: rear-end/hit-from-behind (other party at fault), injury words (whiplash, ER, ambulance, hospital), glass-only (windshield, chip, crack), theft, fire, CAT (hurricane, hail, flood); severity score from loss type, injuries, drivable, damage areas, estimate total, banded low/medium/high/severe; fraud indicators with code/weight/reason (LOSS_NEAR_INCEPTION, LATE_REPORT, NO_POLICE_REPORT_THEFT, PRIOR_CLAIMS, NARRATIVE_EVIDENCE_MISMATCH, ROUND_NUMBER_ESTIMATE) computed from facts passed in; subrogation flag from other-party-at-fault cues, citation of other driver, rear-end; summarize templated plain English; next_best_actions rule list. Confidence values: 0.9 for strong pattern hits, 0.5 weak, 0.2 none. Vertex: lazy dynamic import of @anthropic-ai/vertex-sdk and @google/genai inside available()/run, wrapped in try/catch; unavailable when import fails or process.env.GOOGLE_CLOUD_PROJECT missing; location from GOOGLE_CLOUD_LOCATION default 'global'. Accept opts.sdk injection for tests. Never crash. Use fictional fixtures only.\nSHARED AI TASK I/O SHAPES (all teams code against these; local provider must emit them exactly): ai.run returns {output,provider,model,confidence,explanation,usage,unconfirmed?}. Provider interface (src/ai/providers/\u003cname>.mjs default export factory (ctx,opts)=>{name, available():Promise\u003cboolean>, run(task,input,{tier,schema}):Promise\u003c{output,confidence,explanation,usage,model}|{refusal:true}>}). Outputs: extract_narrative in {text} out {lossType,lossDate,location,injuries:boolean,injuryCues[],atFault:'insured'|'other'|'unknown',cues[]}; extract_document in {kind?,text,filename} out {kind,fields:[{name,value,confidence,provenance:{snippet}}],needsReview}; classify_photo in {filename,metadata?} out {kind:'photo',damageAreas[],vehicle:{make,model,color},fields:[same as above],needsReview}; severity in {facts} out {score 0-100,band,drivers[]}; fraud_signals in {facts} out {score,indicators:[{code,weight,reason}]}; subrogation in {facts} out {flag,reasons[],confidence}; summarize in {facts} out {summary,bullets[]}; next_best_actions in {facts} out {actions:[{code,label,reason,priority}]}. Field names for extracted document facts: policeReportNumber, citedParty, atFaultParty, estimateTotal, repairShop, lossDate, vin, damageAreas.","valueDrivers":["works with no cloud AI configured","cost-controlled model tiering"],"requirements":["REQ-25"],"startedAt":"2026-10-18T20:48:37.052Z","doneAt":"2026-10-18T20:55:49.770Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T20:55:49.769Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria met: 23/23 provider tests pass on rerun, Vertex request shapes/refusal check/availability fallbacks verified, no carrier names/secrets/budget_tokens in code, in-scope paths only"}],"firstPass":true}},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T20:35:12.568Z","history":[{"at":"2026-10-18T20:51:34.605Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:54:27.045Z","from":"in_progress","to":"review"},{"at":"2026-10-18T20:56:29.245Z","from":"review","to":"done"}],"team":"ai","reviewer":"qe-acceptance","sprint":1,"id":"S1-AI-03","title":"Evidence module","story":"Evidence capture and extraction (REQ-05)","points":8,"tier":"mid","owner":"ic-ai-extraction-engineer","paths":["src/modules/evidence/","tests/unit/evidence/"],"contracts":["architecture/contracts/modules.md#evidence","architecture/contracts/domain/Document.schema.json","architecture/contracts/events/claim.evidence.added.schema.json","architecture/contracts/events/claim.evidence.extracted.schema.json","architecture/contracts/openapi.yaml#evidence","architecture/core-runtime-api.md"],"acceptance":["service(ctx) exports addDocument, listDocuments, getDocument, readContent, extract, reviewExtraction, getAcceptedFacts per modules.md#evidence","routes under /claims/{claimId}/documents* match openapi including x-roles; accept base64 JSON and multipart (hand-parsed from req.rawBody); node --test tests/unit/evidence/routes.test.mjs passes","bytes stored AES-GCM encrypted with ctx.crypto per tenant at data/blobs/\u003ctenant>/\u003cclaim>/\u003cdocId> next to dbPath; test asserts file on disk is not plaintext and readContent round-trips","claim.evidence.added triggers extraction via ctx.ai.run (fake in tests); field results carry confidence and provenance; claim.evidence.extracted published without PII; .txt and simple PDF text extraction work, unreadable PDF sets needs_review; photo sidecar metadata handled","kind auto-detect when missing; reviewExtraction updates accepted/value; getAcceptedFacts returns accepted or high-confidence facts only","node --test tests/unit/evidence/*.test.mjs passes"],"brief":"Implement per modules.md#evidence; read core-runtime-api.md for store, bus (publish/subscribe, outbox), crypto (tenant-bound ctx addendum), audit and router APIs. Tables documents and extractions as listed. Upload route: Content-Type application/json {kind?,filename,contentType,contentBase64,metadata?} or multipart/form-data with file part and optional kind/metadata parts; write minimal boundary parser (split on boundary, parse part headers, binary-safe on Buffer). Validate size limit (e.g. 10 MB) and allowed content types. Subscribe to claim.evidence.added and run extract async so upload returns fast; extract is idempotent unless force. Text: .txt decode utf8; PDF: scan for uncompressed text objects (BT ... (text) Tj / TJ ... ET) best-effort, if none mark extraction needs_review. Photos: optional JSON sidecar passed as metadata (damageAreas, make, model, color); without it low confidence. Auto-detect kind from filename/content keywords (police report, estimate, invoice) else other. getAcceptedFacts maps field name to {value,confidence,provenance} for fields with status accepted or confidence >= 0.8 and not rejected. readContent must be audited as sensitive read (ctx.audit). Never log bytes or extracted PII. In tests inject a fake ctx.ai whose run returns the shapes below, fake store/bus per existing tests in tests/unit for patterns. Do not depend on S1-AI-01/02 files.\nSHARED AI TASK I/O SHAPES (all teams code against these; local provider must emit them exactly): ai.run returns {output,provider,model,confidence,explanation,usage,unconfirmed?}. Provider interface (src/ai/providers/\u003cname>.mjs default export factory (ctx,opts)=>{name, available():Promise\u003cboolean>, run(task,input,{tier,schema}):Promise\u003c{output,confidence,explanation,usage,model}|{refusal:true}>}). Outputs: extract_narrative in {text} out {lossType,lossDate,location,injuries:boolean,injuryCues[],atFault:'insured'|'other'|'unknown',cues[]}; extract_document in {kind?,text,filename} out {kind,fields:[{name,value,confidence,provenance:{snippet}}],needsReview}; classify_photo in {filename,metadata?} out {kind:'photo',damageAreas[],vehicle:{make,model,color},fields:[same as above],needsReview}; severity in {facts} out {score 0-100,band,drivers[]}; fraud_signals in {facts} out {score,indicators:[{code,weight,reason}]}; subrogation in {facts} out {flag,reasons[],confidence}; summarize in {facts} out {summary,bullets[]}; next_best_actions in {facts} out {actions:[{code,label,reason,priority}]}. Field names for extracted document facts: policeReportNumber, citedParty, atFaultParty, estimateTotal, repairShop, lossDate, vin, damageAreas.","valueDrivers":["less manual data entry","document d}/triage routes match openapi x-roles; node --test tests/unit/triage/*.test.mjs passes with fake claims, evidence, coverage, rules, ai"],"brief":"Implement per modules.md#triage and TriageResult schema. Inputs: claims.getClaimBundle(claimId), evidence.getAcceptedFacts, coverage.getLatestVerification, rules.evaluate({stage:'triage',facts}) (actions add_severity and set_complexity); all via ctx.modules, each wrapped so absence/failure degrades gracefully (tests inject fakes). Build a normalized facts object (no raw PII in logs), compute inputsHash=sha256 of canonical JSON. Call ctx.ai.run for severity, fraud_signals and subrogation passing {facts}; merge with deterministic logic in separate files (severity.mjs, fraud.mjs, subrogation.mjs, complexity.mjs, explain.mjs, service.mjs, routes.mjs, index.mjs). Severity: AI score plus rule add_severity deltas, clamp 0-100, band from thresholds (low\u003c25, medium\u003c50, high\u003c75, severe). Complexity from parties, injuries, coverage issues, rules set_complexity. Fraud: always compute the deterministic indicators listed, union with AI indicators by code (max weight), score = capped sum scaled 0-100. Subrogation: flag if other party at fault cues, citation of other driver in accepted facts (citedParty), or rear-end where insured is struck; reasons list and confidence. Explanation is plain language sentences built from drivers; record provider/model/confidence from the severity ai result. Table triage_results as listed; attempt increments per claim. Pitfalls: event payload ids/codes/scores only; idempotent on evt.id; avoid retriggering loops (claim.triaged must not trigger triage); read core-runtime-api.md for store/bus.\nSHARED AI TASK I/O SHAPES (all teams code against these; local provider must emit them exactly): ai.run returns {output,provider,model,confidence,explanation,usage,unconfirmed?}. Provider interface (src/ai/providers/\u003cname>.mjs default export factory (ctx,opts)=>{name, available():Promise\u003cboolean>, run(task,input,{tier,schema}):Promise\u003c{output,confidence,explanation,usage,model}|{refusal:true}>}). Outputs: extract_narrative in {text} out {lossType,lossDate,location,injuries:boolean,injuryCues[],atFault:'insured'|'other'|'unknown',cues[]}; extract_document in {kind?,text,filename} out {kind,fields:[{name,value,confidence,provenance:{snippet}}],needsReview}; classify_photo in {filename,metadata?} out {kind:'photo',damageAreas[],vehicle:{make,model,color},fields:[same as above],needsReview}; severity in {facts} out {score 0-100,band,drivers[]}; fraud_signals in {facts} out {score,indicators:[{code,weight,reason}]}; subrogation in {facts} out {flag,reasons[],confidence}; summarize in {facts} out {summary,bullets[]}; next_best_actions in {facts} out {actions:[{code,label,reason,priority}]}. Field names for extracted document facts: policeReportNumber, citedParty, atFaultParty, estimateTotal, repairShop, lossDate, vin, damageAreas.","valueDrivers":["faster routing of complex claims","fraud leakage reduction","subrogation recovery"],"requirements":["REQ-07","REQ-08","REQ-09"],"startedAt":"2026-10-18T20:53:42.004Z"},{"id":"S1-EXP-00","team":"experience","title":"Sprint 1 planning: decompose experience stories into tickets","points":1,"tier":"mid","owner":"mgr-experience","reviewer":"dir-experience","status":"review","sprint":1,"dependsOn":[],"createdAt":"2026-10-18T20:30:52.250Z","history":[{"at":"2026-10-18T20:34:36.145Z","from":"ready","to":"review"}],"paths":["org/board/tickets/"],"acceptance":["Tickets have disjoint paths, no serial dependencies, testable acceptance criteria"]},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T20:34:36.092Z","history":[{"at":"2026-10-18T20:38:15.956Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:41:25.815Z","from":"in_progress","to":"review"},{"at":"2026-10-18T20:46:14.563Z","from":"review","to":"done"}],"id":"S1-EXP-01","team":"experience","title":"UX flows doc and shared UI kit","story":"Story 1: UX flows and shared UI kit","points":8,"tier":"mid","owner":"ic-experience-ux-designer","reviewer":"qe-acceptance","sprint":1,"paths":["architecture/ux-flows.md","src/web/shared/","tests/unit/web/shared/"],"contracts":["architecture/contracts/openapi.yaml (auth/token, config/public, error envelope)","architecture/core-runtime-api.md (static serving)"],"requirements":["REQ-01","REQ-02","REQ-12"],"valueDrivers":["time-to-first-screen","accessibility","multi-tenant white-label","multilingual"],"acceptance":["architecture/ux-flows.md contains four mermaid flowcharts (claimant guided+conversational, CSR-assisted intake, adjuster first view, carrier admin configuration) plus sections on WCAG 2.2 AA targets (focus, contrast, target size, status messages, reduced motion) and multilingual notes (en/es, string keys, no concatenation, locale formats)","src/web/shared/ has api.js, i18n.js, theme.js, devlogin.js, tokens.css, components.css and components/{field,chips,stepper,upload,chat,timeline,toast,table}.js plus components/index.js, matching the KIT INTERFACE in the brief","tokens.css defines colors, spacing, type, radius as CSS custom properties with light and dark (prefers-color-scheme plus [data-theme]); theme.applyBranding maps public-config branding (name, primary color, logo url) to tokens and rejects non-hex colors","i18n has en and es tables with identical key sets (test asserts parity), param interpolation and fallback to en","api.js tests (node --test, fake fetch) cover bearer header, JSON envelope -> ApiError, network failure -> service_unavailable, upload; devlogin refuses when /health or config says production (devMode false) and posts tenant+role to /auth/token","Components are accessible by construction: labels tied to inputs, aria-live for toast and chat, role=list/progressbar semantics for stepper, keyboard operability for chips and table; file upload previews images with object URLs and revokes them","node --test --disable-warning=ExperimentalWarning tests/unit/web/shared/ passes"],"brief":"Build the shared kit and the UX flows doc. Read architecture/contracts/openapi.yaml for /auth/token (request/response), /config/public (PublicConfig schema: branding, lobs, locales) and the Error envelope; read core-runtime-api.md static serving: apps are served from src/web/\u003capp>/ and other paths resolve under src/web/, so apps reference the kit by absolute path /shared/....\n\nKIT INTERFACE (agreed now so apps build in parallel; S1-EXP-01 implements exactly this, apps import it): src/web/shared/api.js exports createApiClient({baseUrl='/api/v1', getToken, fetchImpl=fetch}) returning {get,post,put,patch,del,upload(path,FormData)} that return parsed JSON and throw ApiError {status,code,message,details,requestId} from the error envelope; network failure/5xx/404-on-missing-route throws ApiError with code 'service_unavailable'. src/web/shared/i18n.js exports t(key,params), setLocale, getLocale, registerStrings(locale,table), supportedLocales (en, es). src/web/shared/theme.js exports applyBranding(publicConfig), setScheme('light'|'dark'|'auto'). src/web/shared/devlogin.js exports devLogin(api,{tenant,role}) -> {token,principal}. Components are custom elements registered on import of src/web/shared/components/index.js: fx-field, fx-chips, fx-stepper, fx-upload, fx-chat, fx-timeline, fx-toast, fx-table. Each is attribute/property driven and emits CustomEvents named 'fx-change' (detail {value}) / 'fx-submit'. Shared CSS: src/web/shared/tokens.css and components.css. Apps put pure logic (state, view-models, API orchestration) in plain modules taking an injected api and t, so node tests need no DOM or kit.\n\nVanilla ES modules only, zero dependencies, no build step. Web components may use light DOM or shadow DOM, but expose form value via property and events; if shadow DOM, inherit tokens (custom properties pierce). Keep DOM-free logic (ApiError, interpolation, branding mapping, token validation, file-type checks) in importable functions so node tests run without a DOM; guard customElements/document access (typeof customElements !== 'undefined') so modules import cleanly in node. i18n must not touch window at import. Include keys the apps will need under namespaces common.*, kit.* (apps register their own claimant.*, csr.* tables via registerStrings, so do not add app strings). Dev login must only work when devMode is true; read it from GET /health or a flag the caller passes, and never store secrets. Colors must meet 4.5:1 contrast; focus ring 3:1; targets >= 24px (aim 44px on mobile). Pitfalls: do not edit package.json; no real carrier names or logos; write only your paths.","startedAt":"2026-10-18T20:38:15.956Z","doneAt":"2026-10-18T20:46:14.563Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T20:46:14.563Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria met; 25/25 tests pass (glob form; bare dir arg is a Node 22 limitation); in-scope files only, synthetic data, no PII logging"}],"firstPass":true}},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T20:34:36.094Z","history":[{"at":"2026-10-18T20:38:25.428Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:43:07.400Z","from":"in_progress","to":"review"},{"at":"2026-10-18T20:47:30.125Z","from":"review","to":"in_progress"},{"at":"2026-10-18T20:47:49.787Z","from":"in_progress","to":"review"},{"at":"2026-10-18T20:48:08.231Z","from":"review","to":"done"}],"id":"S1-EXP-02","team":"experience","title":"Claimant web app: guided and conversational intake, evidence, status","story":"Story 2: Claimant web app","points":8,"tier":"mid","owner":"ic-experience-claimant-web-dev","reviewer":"qe-acceptance","sprint":1,"paths":["src/web/claimant/","tests/unit/web/claimant/"],"contracts":["architecture/contracts/openapi.yaml (intake/sessions*, claims/{id}, claims/{id}/documents, config/public, auth/token)","architecture/contracts/domain/IntakeSession.schema.json","architecture/contracts/domain/Claim.schema.json"],"requirements":["REQ-01","REQ-02","REQ-04","REQ-12"],"valueDrivers":["claimant self-service","instant acknowledgment","white-label branding","accessibility","multilingual"],"acceptance":["src/web/claimant/index.html (plus app.js and pure modules) loads at / and picks tenant from ?tenant=aurelia-mutual|kestrel-point (default aurelia-mutual), applies branding from GET /config/public, and shows a visible tenant picker for the demo","Guided mode asks one question at a time from POST /intake/sessions then answers/next-question, rendering by question type, without client-side showIf logic (server decides); back/edit of previous answer supported via re-answering","Conversational mode renders a chat transcript, accepts free-text answers, and displays AI-prefilled answers (as returned in the IntakeStep) with confirm/edit actions before they are accepted","After submit the page shows the claim number immediately, then an evidence upload step (photos/documents to POST /claims/{id}/documents) and a status page with timeline polling GET /claims/{id} (interval configurable, stops on terminal status, pauses when tab hidden)","If API calls fail with service_unavailable or the route is missing, the UI shows a clear 'service unavailable' state with retry, never a blank page or uncaught error","Spanish toggle appears only when the tenant public config lists es; selection persists and html lang updates","Mobile-first CSS (works at 320px), keyboard operable, focus moves to new question heading, aria-live announcements, skip link, reduced-motion respected","Tests in tests/unit/web/claimant/ with a fake api cover the guided state machine, conversational prefill confirmation, submit->upload->status flow, unavailable state, polling stop rule; node --test --disable-warning=ExperimentalWarning tests/unit/web/claimant/ passes"],"brief":"Build the claimant app under src/web/claimant/ against openapi.yaml; the backend may not exist yet, so all logic must tolerate failures.\n\nKIT INTERFACE (agreed now so apps build in parallel; S1-EXP-01 implements exactly this, apps import it): src/web/shared/api.js exports createApiClient({baseUrl='/api/v1', getToken, fetchImpl=fetch}) returning {get,post,put,patch,del,upload(path,FormData)} that return parsed JSON and throw ApiError {status,code,message,details,requestId} from the error envelope; network failure/5xx/404-on-missing-route throws ApiError with code 'service_unavailable'. src/web/shared/i18n.js exports t(key,params), setLocale, getLocale, registerStrings(locale,table), supportedLocales (en, es). src/web/shared/theme.js exports applyBranding(publicConfig), setScheme('light'|'dark'|'auto'). src/web/shared/devlogin.js exports devLogin(api,{tenant,role}) -> {token,principal}. Components are custom elements registered on import of src/web/shared/components/index.js: fx-field, fx-chips, fx-stepper, fx-upload, fx-chat, fx-timeline, fx-toast, fx-table. Each is attribute/property driven and emits CustomEvents named 'fx-change' (detail {value}) / 'fx-submit'. Shared CSS: src/web/shared/tokens.css and components.css. Apps put pure logic (state, view-models, API orchestration) in plain modules taking an injected api and t, so node tests need no DOM or kit.\nBecause the kit is built in parallel, import it by absolute path (/shared/...) only from browser-side files (index.html, app.js, views); keep pure logic modules (flow.js guided state machine, chat.js conversational controller, status.js polling controller, upload.js, strings.js registering claimant.* en/es via registerStrings) free of kit imports: they take injected {api, t, clock, timers}. Tests import only those pure modules and use a hand-written fake api returning IntakeStep-shaped objects (read IntakeStep and IntakeSession schemas for fields: question with id/type/prompt/options/help, prefilled, progress, done).\n\nFlow: auth: claimant dev token via devLogin (role claimant, selected tenant) in dev mode; start session {lob, channel:'web', locale}; loop answers; when question is null call submit with an Idempotency-Key header (crypto.randomUUID) and show the claim number from Claim.claimNumber; then upload evidence; then status page with fx-timeline from the claim's history/status. Polling: default 10s, stop on closed/denied/paid-type terminal statuses read from the Claim schema enum. Persist only language and tenant in localStorage wrapped in try/catch. Pitfalls: never trust client-side branching; escape all text (use textContent); do not store tokens in localStorage (memory/sessionStorage only); no real carrier names; write only your paths; run only your tests.","startedAt":"2026-10-18T20:38:25.428Z","review":{"reworkCount":1,"verdicts":[{"at":"2026-10-18T20:47:30.125Z","by":"qe-acceptance","verdict":"rework","reason":"Missing routes do not reach the 'service unavailable' state. Live server returns 404 {error:{code:'not_found'}} for POST /intake/sessions, but flow.isUnavailable only treats 404 as unavailable when code==='route_not_found', so the start screen shows a generic inline error with no retry. Tests use a fake that never matches the real server. Fix: treat 404 on the start call (and other non-session-scoped routes) as unavailable, and add a test using the real error shape. Everything else checked is fine: 22/22 tests pass, static files served, contract shapes match."},{"at":"2026-10-18T20:48:08.231Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria met; 24 tests pass; start-404 not_found now reaches unavailable+retry; server-driven showIf, idempotent submit, polling stop/pause, es toggle, a11y verified; in-scope paths only"}],"firstPass":false},"doneAt":"2026-10-18T20:48:08.231Z"},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T20:34:36.094Z","history":[{"at":"2026-10-18T20:41:41.911Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:44:36.924Z","from":"in_progress","to":"review"},{"at":"2026-10-18T20:46:47.402Z","from":"review","to":"done"}],"id":"S1-EXP-03","team":"experience","title":"CSR portal: policy search, assisted intake, recent claims","story":"Story 3: CSR portal","points":8,"tier":"mid","owner":"ic-experience-csr-portal-dev","reviewer":"qe-acceptance","sprint":1,"paths":["src/web/csr/","tests/unit/web/csr/"],"contracts":["architecture/contracts/openapi.yaml (auth/token, claims/{id}/coverage, policies/{policyNumber}/snapshot, intake/sessions*, claims list, config/public)","architecture/contracts/domain/IntakeSession.schema.json"],"requirements":["REQ-01"],"valueDrivers":["CSR handle time","assisted intake parity with self-service","accessibility"],"acceptance":["src/web/csr/index.html (plus app.js and pure modules) loads at /csr with a dev-login panel (tenant select, role fixed to csr) that is hidden when dev mode is off","Policy search by policy number/name calls the coverage search endpoint defined in openapi.yaml (policies/{policyNumber}/snapshot or the search path present in the spec; builder documents which) and lists results with select action","Assisted intake uses the same intake session API with channel 'csr' and the selected policyNumber, shows the current question, and a side panel listing required items still missing plus a scripted prompt derived from the question help text","Submit creates the claim, shows claim number and a button/link to open the claim; recent claims list from GET /claims (tenant-scoped, newest first) with keyboard-operable table","Missing endpoints or network failure show a 'service unavailable' state with retry, no uncaught errors","Uses the shared kit components for table, stepper, toast; same accessibility bar (labels, focus management, aria-live, skip link, 320px+ layout)","Tests in tests/unit/web/csr/ with a fake api cover search, missing-items computation, scripted prompt selection, submit, and unavailable state; node --test --disable-warning=ExperimentalWarning tests/unit/web/csr/ passes"],"brief":"Build the CSR portal under src/web/csr/ against openapi.yaml; backend may be mid-flight, so tolerate failures.\n\nKIT INTERFACE (agreed now so apps build in parallel; S1-EXP-01 implements exactly this, apps import it): src/web/shared/api.js exports createApiClient({baseUrl='/api/v1', getToken, fetchImpl=fetch}) returning {get,post,put,patch,del,upload(path,FormData)} that return parsed JSON and throw ApiError {status,code,message,details,requestId} from the error envelope; network failure/5xx/404-on-missing-route throws ApiError with code 'service_unavailable'. src/web/shared/i18n.js exports t(key,params), setLocale, getLocale, registerStrings(locale,table), supportedLocales (en, es). src/web/shared/theme.js exports applyBranding(publicConfig), setScheme('light'|'dark'|'auto'). src/web/shared/devlogin.js exports devLogin(api,{tenant,role}) -> {token,principal}. Components are custom elements registered on import of src/web/shared/components/index.js: fx-field, fx-chips, fx-stepper, fx-upload, fx-chat, fx-timeline, fx-toast, fx-table. Each is attribute/property driven and emits CustomEvents named 'fx-change' (detail {value}) / 'fx-submit'. Shared CSS: src/web/shared/tokens.css and components.css. Apps put pure logic (state, view-models, API orchestration) in plain modules taking an injected api and t, so node tests need no DOM or kit.\nImport the kit by absolute path (/shared/...) only in browser-side files; keep pure logic (search.js, assisted.js computing missing required items from the IntakeStep/IntakeSession answers vs required questions and scripted prompt from question.help with a fallback to the prompt text, recent.js, strings.js registering csr.* en/es) free of kit imports, taking injected {api, t}. Tests use a hand-written fake api.\n\nFlow: devLogin as csr for chosen tenant (dev only, token in memory); search; select policy; start session {lob, channel:'csr', policyNumber}; answer loop as in the intake API (server evaluates showIf); side panel updates each step using the progress/required info in IntakeStep (read the schema; if missing-required list is not provided, derive it from session answers plus the question list, and note the gap in a contract-change request to the architecture hub: node org/cli.mjs post architecture contract-change \"...\" --ticket S1-EXP-03); submit with Idempotency-Key; open claim link goes to /csr?claim=\u003cid> showing a read-only claim summary from GET /claims/{id}. Pitfalls: textContent only for user data; mask nothing client-side but never log PII to console; write only your paths; run only your tests; no real carrier or person names.","startedAt":"2026-10-18T20:41:41.911Z","doneAt":"2026-10-18T20:46:47.402Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T20:46:47.402Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria met; 20/20 tests pass; csr_phone channel (enum has no 'csr') and snapshot-lookup search documented via contract-change; no innerHTML/console, dev panel gated. Note: UI never browser-run."}],"firstPass":true}},{"id":"S1-INT-00","team":"integrations","title":"Sprint 1 planning: decompose integrations stories into tickets","points":1,"tier":"mid","owner":"mgr-integrations","reviewer":"dir-integrations","status":"review","sprint":1,"dependsOn":[],"createdAt":"2026-10-18T20:30:52.250Z","history":[{"at":"2026-10-18T20:34:39.297Z","from":"ready","to":"review"}],"paths":["org/board/tickets/"],"acceptance":["Tickets have disjoint paths, no serial dependencies, testable acceptance criteria"]},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T20:34:39.242Z","history":[{"at":"2026-10-18T20:35:03.031Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:41:02.202Z","from":"in_progress","to":"review"},{"at":"2026-10-18T20:55:01.011Z","from":"review","to":"done"}],"id":"S1-INT-01","team":"integrations","title":"Coverage module with mock PAS adapter and automatic verification","story":"Story 1 (REQ-06)","points":8,"tier":"mid","owner":"ic-integrations-mock-pas-dev","reviewer":"qe-acceptance","sprint":1,"paths":["src/modules/coverage/","tests/unit/coverage/","architecture/contracts/modules.md"],"contracts":["architecture/contracts/modules.md#coverage","architecture/contracts/openapi.yaml (coverage/policy paths)","architecture/contracts/domain/PolicySnapshot.schema.json","architecture/contracts/domain/CoverageVerification.schema.json","architecture/contracts/events/claim.coverage.verified.schema.json"],"acceptance":["src/modules/coverage/ exports service(ctx) with getPolicySnapshot, searchPolicies, verifyCoverage, getLatestVerification, seedPolicies; routes match the openapi coverage and /policies paths","seedPolicies(policies[]) returns { inserted } and stores per-tenant rows in coverage_policies; modules.md coverage section documents it and states contract version 1.1.0","verifyCoverage returns status in_force|lapsed|not_found|excluded|needs_review with reasons[], deductible and limits, and publishes claim.coverage.verified (payload has no PII); results are persisted in coverage_verifications","Rules covered by tests: loss date in/out of term, LOB mismatch, vehicle or property not on policy, collision, comprehensive incl. glass, liability, dwelling, personal property, water damage exclusion (e.g. flood/seepage), missing policy -> not_found, ambiguous -> needs_review","Subscribing to claim.reported triggers verifyCoverage once (idempotent on event id)","searchPolicies finds by lastName, postalCode, vin, phone via ctx.crypto.hmacIndex blind indexes; PII fields are not stored in plaintext index columns","Tenant isolation test: tenant A policies invisible to tenant B","node --test --disable-warning=ExperimentalWarning tests/unit/coverage/ passes"],"brief":"Build src/modules/coverage/ (index.mjs exporting service(ctx), routes.mjs, port.mjs, adapters/mock-pas.mjs, verify.mjs, migrations/schema). Read architecture/core-runtime-api.md for ctx (db, bus, crypto, tenants, clock, modules, route registration, tenant-bound ctx). Policy port: define an adapter interface { id, getPolicy({policyNumber, asOf}), search(criteria) } selected by TenantConfig.integrations.policyPort (default 'mock-pas'); only mock-pas is built in. mock-pas stores synthetic PolicySnapshot docs per tenant in coverage_policies (tenant_id, policy_number, doc, plus blind-index columns last_name_idx, postal_idx, vin_idx, phone_idx from ctx.crypto.hmacIndex). Note modules.md names mock_policies; the ADDED table name is coverage_policies - update modules.md accordingly (contract addition: seedPolicies(policies[]) -> { inserted }, version 1.1.0). The registry file org/contracts/registry.json is outside this team's paths: post a contract-change to the architecture hub asking for the 1.1.0 bump, and mention it in your result. Also cache snapshots in policy_snapshots. verifyCoverage(claimId) calls ctx.modules.claims.getClaim; in tests use a small local fake claims service, do not depend on the claims team's code. Implement the rule logic as a pure function (policy, claim loss facts) -> { status, reasons[], deductible, limits, applicableCoverages } so it is table-testable. Include 6+ synthetic policies in a fixtures file (fictional names only, no real carriers) exported for the platform seed script. Pitfalls: loss date comparison in tenant timezone, glass is a comprehensive sub-coverage, events must carry ids/codes only, handler must use consumed_events idempotency, never log PII. Tests: tests/unit/coverage/{verify,mock-pas,search,service,events}.test.mjs. Write only your paths; do not commit.","valueDrivers":["Faster coverage decision at FNOL","Reduced adjuster manual policy lookup","Licensable policy-port abstraction"],"requirements":["REQ-06"],"startedAt":"2026-10-18T20:35:03.031Z","doneAt":"2026-10-18T20:55:01.011Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T20:55:01.011Z","by":"qe-acceptance","verdict":"accept","reason":"All 7 criteria met; 78/78 coverage tests pass via glob form (bare dir form fails on Node 22.22 for all suites, env issue); registry bump to 1.1.0 pending architecture hub"}],"firstPass":true}},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T20:34:39.244Z","history":[{"at":"2026-10-18T20:35:53.937Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:45:39.783Z","from":"in_progress","to":"review"},{"at":"2026-10-18T20:55:20.670Z","from":"review","to":"done"}],"id":"S1-INT-02","team":"integrations","title":"Integrations module: signed webhooks, delivery worker, outbox API, and API reference docs","story":"Stories 2 (webhooks, REQ-16) and 3 (docs)","points":8,"tier":"mid","owner":"ic-integrations-webhook-dev","reviewer":"qe-acceptance","sprint":1,"paths":["src/modules/integrations/index.mjs","src/modules/integrations/routes.mjs","src/modules/integrations/webhooks/","tests/unit/integrations/webhooks/","tests/unit/integrations/docs/","tests/integration/integrations/webhooks/","architecture/contracts/tools/","docs/api-reference.md"],"contracts":["architecture/contracts/modules.md#integrations","architecture/contracts/openapi.yaml (/integrations/webhooks, deliveries, outbox, adapters)","architecture/contracts/domain/WebhookSubscription.schema.json","architecture/contracts/events/envelope.schema.json"],"acceptance":["Subscription CRUD routes and service fns match openapi and WebhookSubscription.schema.json; create returns secret once; secret stored encrypted (secret_enc) and never returned or logged afterwards","Delivery worker subscribes to '*', filters by event_types and active, POSTs JSON envelope with X-FNOL-Signature (HMAC-SHA256 hex of raw body using the subscription secret), plus X-FNOL-Event-Id; test verifies signature","Failed deliveries (non-2xx or network error) retry with exponential backoff up to a max attempt count, recorded in webhook_deliveries; idempotent per (subscription, event id); injectable clock/fetch in tests","listDeliveries is paginated by cursor; GET /integrations/outbox lists via ctx.bus.outbox with type/subject/afterSequence/limit","index.mjs service(ctx) composes webhooks plus the adapters service from ./adapters/index.mjs (S1-INT-03) via guarded dynamic import so it loads when that file is absent","architecture/contracts/tools/gen-api-reference.mjs generates docs/api-reference.md from openapi.yaml (zero dependencies) and preserves hand-written sections: authentication, tenancy, errors, events and webhooks (with a Node signature verification example), pagination","Tests pass: node --test --disable-warning=ExperimentalWarning tests/unit/integrations/webhooks/ tests/unit/integrations/docs/ tests/integration/integrations/webhooks/"],"brief":"Part A, webhooks: src/modules/integrations/webhooks/{service,worker,signing,routes}.mjs. Use ctx.db for tables webhook_subscriptions, webhook_deliveries (see modules.md), ctx.crypto.encryptPii/decryptPii for the secret, ctx.bus.on('*', handler) with consumed_events idempotency, ctx.clock for backoff (e.g. 30s, 2m, 10m, 1h, 6h; 5 attempts then status 'failed'). Deliver through an injectable fetch (default global fetch) with timeout; validate target URLs (https only except localhost in dev/test; block private ranges in prod config) to avoid SSRF. Retry scheduling: persist next_attempt_at and provide worker.tick() driven by a ctx timer/interval; tests call tick() with a fake clock. Payload is the event envelope (no PII). Include a test receiver using node:http in tests/integration. Part B, wiring: index.mjs exports service(ctx); the adapters service (owned by S1-INT-03) exposes createAdapterService(ctx) from ./adapters/index.mjs returning { listAdapters, previewMapping, pushClaim, routes }; import it with try/catch dynamic import and use a local stub in your unit tests. routes.mjs registers all integrations routes including those the adapter service returns. Part C, docs: gen-api-reference.mjs parses openapi.yaml; since zero-dependency, write a minimal YAML reader sufficient for this file or load via flow-style/JSON-compatible subset - check the file first; if a parser is impractical, post a contract-change asking for an openapi.json mirror rather than adding dependencies. Generated section markers (\u003c!-- BEGIN GENERATED --> ... END) let hand-written sections persist; add an --check flag. Do not edit package.json. Only synthetic data. Do not commit.","valueDrivers":["Real-time partner and downstream notifications","Auditable at-least-once delivery","Faster integrator onboarding via API reference"],"requirements":["REQ-16","REQ-17"],"startedAt":"2026-10-18T20:35:53.937Z","doneAt":"2026-10-18T20:55:20.670Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T20:55:20.670Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria met; 48 tests pass (run per file), docs check up to date, secret encrypted, guarded adapter import, in-scope paths only"}],"firstPass":true}},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T20:34:39.244Z","history":[{"at":"2026-10-18T20:41:35.523Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:48:13.331Z","from":"in_progress","to":"review"},{"at":"2026-10-18T20:55:37.317Z","from":"review","to":"done"}],"id":"S1-INT-03","team":"integrations","title":"Claims-port adapter, ACORD mapping profiles A/B, and fake core suite receiver","story":"Story 2 (REQ-17)","points":8,"tier":"mid","owner":"ic-integrations-adapter-dev","reviewer":"qe-acceptance","sprint":1,"paths":["src/modules/integrations/adapters/","tests/unit/integrations/adapters/","tests/integration/integrations/adapters/"],"contracts":["architecture/contracts/modules.md#integrations","architecture/contracts/openapi.yaml (/integrations/adapters, preview, fake-core)","architecture/contracts/domain/TenantConfig.schema.json (integrations.claimsPort)","architecture/contracts/domain/Claim.schema.json"],"acceptance":["adapters/index.mjs exports createAdapterService(ctx) returning { listAdapters, previewMapping, pushClaim, routes, init } as agreed with S1-INT-02","Claims-port interface { id, format, map(bundle, profile), send(payload, target) } with sample 'core-claims-suite' adapter registered","Two mapping profiles: A (Aurelia-style) and B (Kestrel-style), selected by tenant config integrations settings; each outputs ACORD-aligned JSON; unmapped[] and warnings[] reported; golden-file tests for both profiles","previewMapping(adapterId, claimId) returns { adapterId, format, payload, unmapped, warnings } without sending or writing core_sync","Built-in fake core receiver route POST /api/v1/integrations/fake-core/claims stores what it receives (tenant scoped) and returns a core claim number; GET to list received payloads for tests","pushClaim sends to the pluggable target (default: fake core, in-process or HTTP URL from config), records core_sync, and calls claims.setExternalRef; failure leaves core_sync status 'failed' and does not throw to the bus","claim.routed (or event named in claimsPort.pushOn) triggers pushClaim exactly once per event id; repeated with same payload hash is a no-op","Tests pass: node --test --disable-warning=ExperimentalWarning tests/unit/integrations/adapters/ tests/integration/integrations/adapters/"],"brief":"Build under src/modules/integrations/adapters/: index.mjs (createAdapterService), port.mjs (interface plus registry), core-claims-suite.mjs, profiles/{a,b}.mjs, acord-map.mjs (shared helpers), fake-core.mjs (receiver routes + tables fake_core_claims and core_sync). Interface contract with S1-INT-02: S1-INT-02 owns index.mjs/routes.mjs one level up and imports ./adapters/index.mjs; you return route definitions in the same shape the core runtime uses (see architecture/core-runtime-api.md) and register your bus handler in init(). Consume ctx.modules.claims.getClaimBundle, claims.setExternalRef, triage.getLatestTriage, coverage.getLatestVerification; in tests use small local fakes for these modules (no dependency on other teams' code). Read tenant config via ctx.tenants.get(...).integrations (claimsPort: { adapter, profile, target, pushOn }); default profile A, default pushOn claim.routed. ACORD alignment: use ACORD-style object names (ClaimsOccurrence, InsurancePolicy, Claimant, Loss, Vehicle/Property, AdjusterAssignment); profile A nests by ACORD aggregates with camelCase and ISO dates, profile B flattens with UPPER_SNAKE keys and YYYYMMDD dates and different coded loss-cause values - document both in a comment table. Payload must be deterministic (sorted keys) so the hash is stable. Pitfalls: PII appears in payload (intended, it goes to the carrier core) but never in logs or bus events; fake core must be tenant scoped; core claim numbers deterministic per tenant sequence, e.g. CC-\u003csequence>. Tests: tests/unit/adapters/{profile-a,profile-b,preview,push,fake-core}.test.mjs under tests/unit/integrations/adapters/, and tests/integration/integrations/adapters/core-push.test.mjs driving claim.routed through a real bus. Do not commit; write only your paths.","valueDrivers":["Drop-in connection to carrier core claims system","Configurable mapping per tenant without code","Demonstrable end-to-end handoff in PoC"],"requirements":["REQ-17"],"startedAt":"2026-10-18T20:41:35.523Z","doneAt":"2026-10-18T20:55:37.317Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T20:55:37.317Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria met; 33 unit+integration tests pass (golden A/B, preview, fake core, failure recording, once-per-event, tenant isolation)"}],"firstPass":true}},{"id":"S1-PLT-00","team":"platform","title":"Sprint 1 planning: decompose platform stories into tickets","points":1,"tier":"mid","owner":"mgr-platform","reviewer":"dir-platform","status":"review","sprint":1,"dependsOn":[],"createdAt":"2026-10-18T20:30:52.250Z","history":[{"at":"2026-10-18T20:35:01.154Z","from":"ready","to":"review"}],"paths":["org/board/tickets/"],"acceptance":["Tickets have disjoint paths, no serial dependencies, testable acceptance criteria"]},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T20:35:01.102Z","history":[{"at":"2026-10-18T20:43:48.463Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:44:35.502Z","from  before 2026-10-04 (two weeks before 2026-10-18); pin exactly in optionalDependencies. Edit package.json only in optionalDependencies. Run npm install (it is acceptable for the install to need the proxy; if the registry is unreachable, report it rather than hand-writing the lockfile). Verify the vertex-sdk import and note whether @google/genai imports too. For licenses, read each package's license field from npm ls --all --json plus node_modules/*/package.json; include a table: package, version, license, required/optional, notes. Flag anything not MIT/Apache-2.0/BSD/ISC; mention that the core itself has zero runtime dependencies and AI providers load lazily and optionally. Scheduler: src/core/scheduler.mjs, zero deps, ES module. every(ms, fn, {name}) uses setInterval with .unref(), wraps fn in try/catch (await async fns, skip overlapping runs of the same job), logs failures via an optional logger passed to createScheduler({log}) with console fallback, returns a cancel() function; stopAll() clears everything; expose list() of job names. Export a default createScheduler(opts) factory so server.mjs can later call stopAll on close. Do not edit server.mjs. After tests pass, post: AGENT_ID=ic-platform-runtime-dev node org/cli.mjs post platform status 'scheduler available at src/core/scheduler.mjs' --ticket S1-PLT-02.","valueDrivers":["licensability","vertex AI readiness","operational hygiene"],"requirements":["REQ-22"],"startedAt":"2026-10-18T20:44:48.556Z","doneAt":"2026-10-18T20:47:03.852Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T20:47:03.852Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria verified: exact pins published 2026-09-30/10-02, lockfile present, imports work, licenses flag fast-sha256, scheduler unref/stopAll not wired, 6 tests pass"}],"firstPass":true}},{"id":"S1-PMO-00","team":"pmo","title":"Sprint 1 planning: decompose pmo stories into tickets","points":1,"tier":"mid","owner":"mgr-pmo","reviewer":"dir-pmo","status":"review", g \u003c3 tickets, zero-ticket and zero-points edge cases, no division by zero or NaN","Running the CLI on the real board produces valid JSON files in org/scorecards/"],"brief":"Build org/scorecards.mjs. Input: tickets from org/board/tickets (use listTickets from org/fabric.mjs in the CLI path only; pure functions take arrays so tests use fixtures). Only status done tickets count. Ticket fields: owner, tier, team, points, sprint, startedAt/doneAt (hours = doneAt-startedAt), spend.usd, review.firstPass, review.reworkCount, review.escapedDefects. Group by owner id (key 'owner' and also by 'owner+tier' configuration) and by team. Metrics: firstPassAcceptance = share with review.firstPass; reworkRate = share with reworkCount>0; defects = sum escapedDefects / tickets, capped 0..1 for composite; estimateAccuracy = clamp(1 - |hoursPerPoint/medianHoursPerPoint - 1|, 0, 1); costEfficiency = clamp(medianCostPerPoint/costPerPoint,0,1), 1 when no data. Median is over all done tickets. Composite: 0.35*firstPass + 0.2*(1-rework) + 0.2*estimateAccuracy + 0.15*costEfficiency + 0.1*(1-defects). Low performer: bottom 10% composite among rows with >=3 tickets, or composite below the target two sprints running (read earlier org/scorecards/sprint-\u003cn>.json if present, tolerate absence). Output shape (shared with the dashboard ticket S1-PMO-02, do not change): {sprint, generatedAt, medians:{hoursPerPoint,costPerPoint}, agents:[row], configs:[row], teams:[row]} where row = {key, owner?, tier?, team?, ticketsDone, points, firstPassAcceptance, reworkRate, defects, hoursPerPoint, costPerPoint, composite, lowPerformer, lowConfidence, diagnosis:[string]}. Round to 3 decimals. Pitfalls: missing spend or timestamps, deterministic ordering (sort by key), do not touch other files. Do not git commit; edit nothing outside your paths. Run: node --test --disable-warning=ExperimentalWarning tests/unit/org/scorecards.test.mjs.","startedAt":"2026-10-18T20:53:43.737Z","doneAt":"2026-10-18T20:58:10.404Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T20:58:10.403Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria met: 9 tests pass, CLI on real board writes valid JSON with all row fields, composite/low-performer rules match config, diagnosis heuristics present"}],"firstPass":true}},{"status":"review","dependsOn":[],"createdAt":"2026-10-18T20:35:09.988Z","history":[{"at":"2026-10-18T20:54:56.344Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:56:51.962Z","from":"in_progress","to":"review"}],"id":"S1-PMO-02","team":"pmo","title":"Sprint plan/close tooling and dashboard upgrades","story":"As leadership I run sprint plan and close commands and see review/retro, improvement log, team scorecards, tier spend mix and value drivers on one self-contained dashboard.","points":8,"tier":"mid","owner":"ic-pmo-dashboard-dev","reviewer":"qe-acceptance","sprint":1,"paths":["org/sprint.mjs","dashboard/","tests/unit/dashboard/","tests/unit/org/sprint.test.mjs"],"contracts":["org/config.json targets","product/value-propositions.md VD-1..VD-6","org/scorecards output shape defined in S1-PMO-01 brief"],"valueDrivers":["VD-3"],"requirements":[],"acceptance":["node org/sprint.mjs plan \u003cn> sums points of tickets with sprint n and writes committed list and committedPoints into org/sprints/sprint-\u003cn>.json, preserving existing fields","node org/sprint.mjs close \u003cn> writes review {completedPoints, committedPoints, usd, pointsPerDollar, firstPassAcceptance, reworkRate, testPassRate/testsPassed from org/quality.json} without discarding existing retro or other fields; exported pure functions planSprint and closeSprint are tested in tests/unit/org/sprint.test.mjs with a temp dir","Dashboard shows sprint review and retro text, improvement log (before/after/result from org/improvements.json), team scorecards with low-performer flags, model-tier mix of spend, and a value drivers panel listing VD-1..VD-6 with linked tickets via ticket.valueDrivers","New
