arios, fictional data, zero deps, in-scope paths only"}],"firstPass":true}},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T20:34:25.094Z","history":[{"at":"2026-10-18T20:35:51.987Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:37:58.339Z","from":"in_progress","to":"review"},{"at":"2026-10-18T20:45:51.646Z","from":"review","to":"done"}],"id":"S1-QE-03","team":"quality","title":"E2E scenario harness","story":"E2E scenario harness tests/e2e/scenarios.test.mjs","points":5,"tier":"mid","owner":"ic-quality-e2e-engineer","reviewer":"qe-acceptance","sprint":1,"paths":["tests/e2e/"],"contracts":["architecture/core-runtime-api.md","architecture/contracts/openapi.yaml","architecture/contracts/modules.md","architecture/contracts/events"],"acceptance":["node --test --disable-warning=ExperimentalWarning tests/e2e/ exits 0 even when other modules are missing","scenarios.test.mjs boots createApp on port 0 with a temp db and the real tenants dir and closes it in after()","Per scenario x tenant it runs steps: report, upload documents, bus drain, coverage, triage, routing/STP, adjuster first view, each asserting an outbox event and comparing scenario.expected","Missing module/endpoint (404 or undefined ctx.modules.x) yields t.todo with a reason, never a failure","Works with tests/synthetic/index.mjs when present and falls back to a local fake in tests/e2e/fakes/ when absent"],"brief":"Create tests/e2e/scenarios.test.mjs and helpers in tests/e2e/ (harness.mjs, fakes/synthetic-fallback.mjs, steps.mjs). Read architecture/core-runtime-api.md (createApp signature, ctx.forTenant(t), bus drain, outbox access, port 0) and openapi.yaml for endpoints and auth headers. Do not depend on S1-QE-02 landing: dynamic import('../synthetic/index.mjs') in try/catch; if missing, use fakes/synthetic-fallback.mjs that implements the same contract (generatePolicies, SCENARIOS, generateScenario returning name, lob, lossType, intakeAnswers, claimCreate, documents, expected) with 2 trivial scenarios. Tenants: list tenants dir ids; if none exist yet, mark everything t.todo with reason. A scenario applies to a tenant if tenant config lists the lob (when config declares lobs), else to all. Seed policies via ctx.forTenant(t).modules.coverage?.seedPolicies when defined, else todo coverage-dependent steps. Step pattern: a helper step(t, name, fn) that catches a NotImplemented outcome (HTTP 404/501 or missing module) and calls t.todo(reason); real assertion failures fail normally. After each step await bus drain (per core API) and query the outbox for the expected event type from contracts/events (look up exact names, do not invent); assert it exists for the claim. Compare coverageStatus, severityBand, fraud, subrogation, fastTrack against scenario.expected only when the step produced data. Use node:test subtests per scenario/tenant, node:http/fetch for calls, os.tmpdir mkdtemp for db and cleanup. Add a small tests/e2e/harness.test.mjs verifying the todo-mapping logic and that createApp boots. Pitfalls: always close the server and db, no fixed ports, keep runtime under ~30s.","valueDrivers":["quality","visible progress"],"requirements":[],"startedAt":"2026-10-18T20:35:51.987Z","doneAt":"2026-10-18T20:45:51.646Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T20:45:51.646Z","by":"qe-acceptance","verdict":"accept","reason":"All 5 criteria met; e2e suite exits 0 (29 pass, 0 fail, 120 todo with reasons); boots createApp port 0 with temp db + real tenants; per-step outbox asserts and expected comparison; synthetic fallback present."}],"firstPass":true}},{"id":"S1-SEC-00","team":"security","title":"Sprint 1 planning: decompose security stories into tickets","points":1,"tier":"mid","owner":"mgr-security","reviewer":"dir-security","status":"review","sprint":1,"dependsOn":[],"createdAt":"2026-10-18T20:30:52.250Z","history":[{"at":"2026-10-18T20:34:26.362Z","from":"ready","to":"review"}],"paths":["org/board/tickets/"],"acceptance":["Tickets have disjoint paths, no serial dependencies, testable acceptance criteria"]},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T20:34:26.301Z","history":[{"at":"2026-10-18T20:35:04.501Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:45:21.249Z","from":"in_progress","to":"review"},{"at":"2026-10-18T20:57:51.192Z","from":"review","to":"done"}],"id":"S1-SEC-01","team":"security","title":"Threat model, data-protection design, compliance mapping and security overview","story":"As a carrier security reviewer I want a STRIDE threat model, data-protection design and compliance mapping tied to concrete code controls so that I can assess the platform for licensing.","points":8,"tier":"strong","owner":"ic-security-threat-modeler","reviewer":"qe-acceptance","sprint":1,"paths":["architecture/threat-model.md","architecture/data-protection.md","docs/security-overview.md","docs/compliance-mapping.md"],"contracts":["architecture/overview.md","architecture/contracts/openapi.yaml","architecture/contracts/events/envelope.schema.json","architecture/contracts/domain/","architecture/core-runtime-api.md","org/decisions/ADR-001-stack-and-layout.md"],"acceptance":["architecture/threat-model.md contains a mermaid trust-boundary diagram covering browser/client, API/router, modules, SQLite store, outbox/webhooks, AI provider, mock PAS and file storage","STRIDE table has one row set per component and per trust boundary of architecture/overview.md, each with threat, mitigation and a control citing a real src/core file (auth.mjs, store.mjs, crypto.mjs, audit.mjs, bus.mjs, log.mjs, router.mjs, tenant-context.mjs); reviewer greps cited files exist","Top-10 risks ranked by likelihood x impact with mitigation, owner team and status (implemented/planned)","Multi-tenant isolation section analyses store rewriting limits (regex SQL rewrite, CTE/string-literal gaps from core-runtime-api.md assumptions), X-Tenant-Id handling, per-tenant keys, tctx binding and cache, with residual risks","AI-specific section covers prompt injection via uploaded documents, untrusted model output (schema validation, confidence/explanation, human review), data sent to providers (minimization, redaction, no-training terms, per-tenant opt-out) and provider failure","architecture/data-protection.md has a PII inventory table generated from x-pii fields in architecture/contracts/domain/*.schema.json (field, schema, handling), encryption at rest per tenant key via ctx.crypto.encryptPii/hmacIndex, key-management and rotation path to Cloud KMS, retention schedule, log redaction rules (ctx.log key list), and the synthetic-data-only rule","docs/compliance-mapping.md has tables mapping GLBA Safeguards Rule, NAIC #668, state claim-handling timelines (WI/IL/MI marked illustrative, how claims timers implement acknowledge/decide/pay deadlines) and SOC 2 CC6, CC7, CC8 to control -> evidence location (file or test path)","docs/security-overview.md is a customer-facing summary (\u003c=2 pages) with no internal-only detail, no real carrier names, and links to the other docs; claims not yet built are labelled planned","No secrets, real names or real carriers anywhere; only the four owned paths changed"],"brief":"Read architecture/overview.md first and enumerate its components and trust boundaries; build the STRIDE tables from that list so nothing is missed. Then read src/core/*.mjs and cite real behavior only: do not claim controls that are not in code. Mark gaps as 'planned' with an owning team. Known facts to use: tokens are HMAC-SHA256 dev tokens (auth.mjs) with key derived from master key; /api/v1/auth/token is dev-mode only; X-Tenant-Id only for platform_admin; store.forTenant rewrites SELECT/UPDATE/DELETE with a tenant filter, raw INSERT into tenant tables throws, system store throws on tenant tables; crypto derives per-tenant keys (deriveKey), encryptPii/decryptPii/hmacIndex; audit_log is hash-chained and append-only via triggers, verify() available, GET /api/v1/audit needs supervisor/carrier_admin/platform_admin; events carry no PII (ids/codes/scores) and webhooks are HMAC-SHA256 signed; logger redacts keys matching name|email|phone|dob|address|ssn|license|plate; 15MB body limit. Grep x-pii in architecture/contracts/domain/ for the PII inventory (script it if many; keep output in the table). Timers: claims module owns regulatory timers per architecture/overview.md decisions; describe the mechanism generically and label WI/IL/MI day counts illustrative (not legal advice). Evidence location column should point to tests/security/*.test.mjs (written by S1-SEC-02) where applicable. Key rotation: describe versioned key ids, re-encrypt job, KMS envelope encryption (data key wrapped by Cloud KMS key per tenant) as the path; mark as planned. Include a short residual-risk/backlog list for Sprint 2. Use mermaid fenced blocks. Do not edit src/ or tests/. Post any contract gap to the architecture hub.","valueDrivers":["VD-trust","VD-compliance","VD-time-to-license"],"requirements":["Threat model per component and trust boundary","Multi-tenant isolation analysis","AI-specific threats","PII inventory, encryption, retention, redaction","GLBA, NAIC 668, state timelines, SOC 2 mapping","Customer-facing security overview"],"startedAt":"2026-10-18T20:35:04.501Z","doneAt":"2026-10-18T20:57:51.192Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T20:57:51.192Z","by":"qe-acceptance","verdict":"accept","reason":"All four docs meet criteria (mermaid + STRIDE for 13 components/9 boundaries, ranked top-10, isolation limits R1/R3/R4 reproduced by me, AI threats, PII inventory 14/7 matches x-pii, GLBA/NAIC/SOC2/state timelines illustrative, planned items labelled); nit: a few src line cites are off (e.g. bus.mjs:163 is really ~56)"}],"firstPass":true}},{"status":"in_progress","dependsOn":[],"createdAt":"2026-10-18T20:34:26.304Z","history":[{"at":"2026-10-18T20:35:23.578Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:37:54.611Z","from":"in_progress","to":"review"},{"at":"2026-10-18T20:57:16.509Z","from":"review","to":"in_progress"}],"id":"S1-SEC-02","team":"security","title":"Security regression suite: tenant isolation, role enforcement, PII leakage, audit chain","story":"As a security reviewer I want an automated regression suite that attacks every API route so that tenant isolation, role checks and PII hygiene are proven as modules land.","points":5,"tier":"mid","owner":"ic-security-authz-engineer","reviewer":"qe-acceptance","sprint":1,"paths":["tests/security/"],"contracts":["architecture/contracts/openapi.yaml","architecture/core-runtime-api.md","architecture/contracts/modules.md","architecture/contracts/events/envelope.schema.json"],"acceptance":["Running node --test --disable-warning=ExperimentalWarning tests/security/ exits 0 on the current tree (unimplemented routes are skipped, not failed)","tests/security/helpers.mjs boots createApp({port:0}) with a temp dbPath/secretsDir and two synthetic tenants (tenant-a, tenant-b, written as temp tenants dir JSON) and issues tokens via ctx.auth.issueToken; closes app and removes temp dir after","tests/security/routes.test.mjs enumerates every path+method in openapi.yaml (minimal YAML parse or a checked-in path list verified against the file) with its x-roles; a count assertion fails if the list drifts from the spec","tests/security/tenant-isolation.test.mjs: for each route taking an id, tenant-B token against tenant-A resource gives 404/403 and never 200; list endpoints for B never contain A ids; X-Tenant-Id from non-platform_admin gives 403","tests/security/roles.test.mjs: for each route a token whose roles are not in x-roles gets 403 (claimant refused on adjuster/admin routes), no token gets 401; allowed role is not 401/403","tests/security/pii-leak.test.mjs: creates a claim with known synthetic PII values (distinctive name, email, phone, plate), then asserts none appear in plaintext in ctx.bus.outbox payloads, captured log output, or raw SQLite columns marked x-pii; skips with t.skip if claims module is absent","tests/security/audit-chain.test.mjs: after activity, ctx.audit.verify(tenant) returns ok:true for both tenants, and tampering via ctx.db.raw is rejected by the append-only triggers","Skipped tests carry a reason string naming the missing module; no test is silently passing when a route is unimplemented","Only tests/security/ changed"],"brief":"Use node:test and node:assert only. helpers.mjs: mkdtemp dir; write tenants/tenant-a.json and tenant-b.json with minimal valid TenantConfig (check architecture/contracts/domain/TenantConfig schema and tenants/README.md; use fictional names like 'Northwind Mutual Demo'); call createApp({dbPath,secretsDir,tenantsDir,port:0,devMode:true,logLevel:'info'}) and use app.url with fetch. Capture logs by passing a logLevel and wrapping process.stdout.write during the test (restore in finally), or read ctx.log if it accepts a sink; document the approach. Mint tokens with app.ctx.auth.issueToken({sub,tenantId,roles}). Role names come from ctx.auth.ROLES. Route enumeration: parse openapi.yaml with a ~40 line line-based parser (paths at 2-space indent under 'paths:', methods at 4-space, x-roles inline list or block list); if parsing proves brittle keep an explicit list in routes.mjs plus a test that every parsed path is in the list. Replace {param} with a plausible id such as clm_00000000000000000000. Classification: status 404 with error.code not_found/route_not_found for a path whose module is not loaded => t.skip('module \u003cx-module> not implemented') ; use x-module from the spec and ctx.moduleNames to decide. Distinguish 'route absent' (router 404 for unknown route) from 'resource absent' (module 404): for isolation tests, seed a resource via the module service or API as tenant A where possible, otherwise skip with reason. Role test must pass the role gate before body validation, so a 400/404/422 for an allowed role is fine; only 401/403 are failures there. For PII test, use values like 'Zebulon Quillfeather', 'zq.test@example.invalid', '555-0142-9917', plate 'ZQ-7781'. Use per-test timeouts and always await app.close(). Do not touch src/. If the core misbehaves, record it with a failing-but-named test only if it is a real defect and post a contract-change/incident to the architecture hub.","valueDrivers":["VD-trust","VD-compliance","VD-quality"],"requirements":["Cross-tenant access denied on every route","x-roles enforced on every route","No PII in events or logs","Audit chain verifies","Suite turns green as modules land"],"startedAt":"2026-10-18T20:35:23.578Z","review":{"reworkCount":1,"verdicts":[{"at":"2026-10-18T20:57:16.509Z","by":"qe-acceptance","verdict":"rework","reason":"Suite exits 1 on current tree (6 fail/134 pass): tenant-isolation route tests fail now that modules landed - webhooks {id} routes crash on tokenFor (tenant_admin not issuable), GET /claims/{id}/documents returns 200 for tenant B (investigate real leak vs test bug); route-role drift now broad. Also 'node --test tests/security/' dir form errors on Node 22 (use glob)."}],"firstPass":false}},{"id":"S1-WFL-00","team":"workflow","title":"Sprint 1 planning: decompose workflow stories into tickets","points":1,"tier":"mid","owner":"mgr-workflow","reviewer":"dir-workflow","status":"review","sprint":1,"dependsOn":[],"createdAt":"2026-10-18T20:30:52.250Z","history":[{"at":"2026-10-18T20:34:36.785Z","from":"ready","to":"review"}],"paths":["org/board/tickets/"],"acceptance":["Tickets have disjoint paths, no serial dependencies, testable acceptance criteria"]},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T20:34:36.733Z","history":[{"at":"2026-10-18T20:38:18.115Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:43:38.057Z","from":"in_progress","to":"review"},{"at":"2026-10-18T20:57:24.255Z","from":"review","to":"done"}],"team":"workflow","reviewer":"qe-acceptance","sprint":1,"id":"S1-WFL-01","title":"Config module, schema validator and two demo tenants","story":"As a carrier admin I can read, validate and update tenant configuration, and two materially different demo tenants ship ready to load.","points":8,"tier":"mid","owner":"ic-workflow-domain-modeler","paths":["src/modules/config/","tenants/","tests/unit/config/"],"contracts":["architecture/contracts/modules.md#config","architecture/contracts/openapi.yaml (/config paths)","architecture/contracts/domain/TenantConfig.schema.json","architecture/contracts/events/ (tenant.config.updated)"],"requirements":["REQ-13","REQ-22"],"valueDrivers":["VD-3"],"acceptance":["src/modules/config/validator.js exports a zero-dependency JSON Schema subset validator (type, required, properties, items, enum, const, pattern, min/max, additionalProperties, $ref to local and sibling schema files, oneOf/anyOf) and tests/unit/config/validator.test.js passes","src/modules/config/service.js exports validateTenantConfig(cfg) returning {valid,errors[]} with schema errors plus semantic errors: invalid rule conditions (via rules.validateRules, tolerated absent with a local fake in tests), duplicate question ids, timers referencing unknown states; each covered by a named test","Module exports service(ctx) and registers validateTenantConfig through ctx.tenants.addValidator; routes match openapi /config paths with x-roles enforced; updates publish tenant.config.updated and write audit","tenants/aurelia-mutual.json and tenants/kestrel-point.json both pass validateTenantConfig (tests/unit/config/tenants.test.js) and differ in branding, LOBs, states, locales, STP thresholds, SIU threshold, queues, timers","Aurelia: personal_auto + homeowners, WI+IL, en+es, aggressive STP (glass and home under 2500); Kestrel: personal_auto + commercial_auto, MI, en only, STP glass only, stricter SIU threshold; question sets with showIf per LOB/loss type; synthetic adjusters; timers labelled illustrative, not legal advice; webhooks; ai provider cascade with local first","Only synthetic data; no real carrier or person names; no secrets in files"],"brief":"Read product/requirements.md lines ~120-135 first and follow them exactly. Build in src/modules/config/: validator.js (small recursive JSON Schema subset; resolve $ref relative to architecture/contracts/domain/ by loading files at runtime via fs; make it reusable, export validate(schema,data,{resolve})), service.js (validateTenantConfig, getConfig, putConfig, publishing flow per modules.md#config using ctx.tenants, ctx.audit, ctx.events), routes.js (per openapi /config), index.js exporting service(ctx) and registering the validator with ctx.tenants.addValidator. Use architecture/core-runtime-api.md for exact ctx shapes and the tenant-bound ctx addendum; do not guess method names. rules.validateRules lives in another team's parallel ticket (S1-WFL-02): call ctx.modules.rules?.validateRules if present, otherwise skip, and use a local fake in tests. Semantic checks: question ids unique per tenant, every timer's state references a lifecycle state from architecture/overview.md section 7, rule conditions valid. Demo tenants: write JSON against the schema, check required fields carefully; use the condition language in architecture/domain-model.md for showIf and STP/routing rules. Timer deadlines for WI/IL/MI should be plausible day counts with description text 'Illustrative, not legal advice'. Provide at least 4 queues per tenant with 2-3 fake adjusters each (needed by round-robin routing). Pitfall: do not edit package.json; run only node --test --disable-warning=ExperimentalWarning tests/unit/config/. Post any contract gap to the architecture hub.","startedAt":"2026-10-18T20:38:18.115Z","doneAt":"2026-10-18T20:57:24.255Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T20:57:24.255Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria met; 53/53 config tests pass; routes, event/audit, tenant differentiation, synthetic data verified. Nit: validator test file is .mjs not .js."}],"firstPass":true}},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T20:34:36.735Z","history":[{"at":"2026-10-18T20:43:59.764Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:50:24.728Z","from":"in_progress","to":"review"},{"at":"2026-10-18T20:57:40.168Z","from":"review","to":"done"}],"team":"workflow","reviewer":"qe-acceptance","sprint":1,"id":"S1-WFL-02","title":"Rules engine, routing and STP decisions","story":"As an operations lead I can configure routing and straight-through rules that are evaluated with traces and applied automatically after triage.","points":8,"tier":"mid","owner":"ic-workflow-rules-engine-dev","paths":["src/modules/rules/","tests/unit/rules/"],"contracts":["architecture/contracts/modules.md#rules","architecture/domain-model.md (condition language)","architecture/contracts/domain/RoutingDecision.schema.json","architecture/contracts/domain/TenantConfig.schema.json","architecture/contracts/openapi.yaml (routing paths)","architecture/contracts/events/ (claim.triaged, claim.routed)"],"requirements":["REQ-10","REQ-11"],"valueDrivers":["VD-1","VD-2","VD-3"],"acceptance":["src/modules/rules/condition.js exports pure evaluateCondition(cond,facts) returning {result,trace} covering every operator in the Condition language (all/any/not, comparison, in, exists, contains, etc.); tests/unit/rules/condition.test.js covers each operator, missing facts and nested traces","evaluate({stage,...}) and validateRules(rules) exported from the service; validateRules reports path-specific errors for unknown operators/fields; tested","buildFacts(claimId) gathers claim, triage, coverage, policy facts via ctx.modules.claims/triage fakes; route(claimId) returns a RoutingDecision valid against RoutingDecision.schema.json with queue, adjuster chosen round-robin among queue members (persisted counter, deterministic in tests), fastTrack with reasons, ruleIds fired","route publishes claim.routed and audits; subscribing to claim.triaged routes automatically; tested with fake ctx","Routes match openapi routing paths with x-roles; tests/unit/rules/routing.test.js and service.test.js pass","Tenant rule changes apply on next evaluation without restart (config read per call)"],"brief":"Condition evaluator must be a pure module with no ctx access so config (S1-WFL-01) and others can import it; expose it as ctx.modules.rules.evaluateCondition too since intake (S1-WFL-04) calls rules.evaluateCondition(cond,facts) for showIf. Read the exact operator list and fact namespaces from architecture/domain-model.md; trace entries should record operator, path, actual value, expected and result. Service: export service(ctx) per modules.md#rules; read rule sets and queues from the tenant config via the tenant-bound ctx (see architecture/core-runtime-api.md addendum). Stages: 'routing' and 'stp' at least; first-match vs all-match semantics as written in domain-model.md. Round-robin: keep a per-tenant per-queue cursor in module storage (ctx.db) and sort members by id for determinism. fastTrack reasons come from fired STP rule names/ids. Do not depend on other teams' code: write small local fakes for claims, triage and tenant config in tests/unit/rules/fakes.js. Events carry no PII (ids/codes only). Subscribe in subscribe(ctx) or as modules.md prescribes. Pitfall: keep route idempotent per claim (re-route on same triage event must not advance round-robin twice; key on evt.id). Run only node --test --disable-warning=ExperimentalWarning tests/unit/rules/.","startedAt":"2026-10-18T20:43:59.764Z","doneAt":"2026-10-18T20:57:40.168Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T20:57:40.168Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria met; 46/46 tests pass (condition, routing, service); routes match openapi; live config read per call; only rules paths touched"}],"firstPass":true}},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T20:34:36.736Z","history":[{"at":"2026-10-18T20:45:53.018Z","from":"ready","to":"in_progress"},{"at":"2026-10-18T20:53:21.004Z","from":"in_progress","to":"review"},{" s a fake clock","claim.checks records coverage, evidence and triage results from their events (claim.coverage.verified etc. per the event list); tests/unit/claims/checks.test.js","Routes match openapi /claims paths with x-roles; tests/unit/claims/routes.test.js"],"brief":"Implement service(ctx) in src/modules/claims/{index,service,lifecycle,pii,timers,routes}.js. Read architecture/overview.md section 7 for the exact states and transitions and encode them as a table in lifecycle.js. Use architecture/core-runtime-api.md for ctx.db, ctx.events, ctx.audit, ctx.crypto, ctx.clock, ctx.tenants and the tenant-bound ctx addendum; do not invent method names. Decision recorded by architecture: coverage/evidence results go in claim.checks, not sub-states; routing is owned by rules (it sets queue/assignee via a service function in modules.md#claims, not by writing status). PII: walk Claim.schema.json for x-pii, encrypt those paths on write, decrypt on read; never put PII in events or audit diffs (store field names only). Timers: timer definitions come from tenant config (see tenants/ examples being authored in parallel in S1-WFL-01; in tests use an inline fake tenant config with WI/IL style definitions). Timer lifecycle: pending -> due (warn threshold) -> breached, completing on the satisfying event or transition. sweepTimers(now) must be idempotent and handle a clock jump. Fake the policy, coverage and rules modules in tests/unit/claims/fakes.js. Run only node --test --disable-warning=ExperimentalWarning tests/unit/claims/.","startedAt":"2026-10-18T20:45:53.018Z","doneAt":"2026-10-18T20:57:59.276Z","review":{"reworkCount":0,"verdicts":[{"at":"2026-10-18T20:57:59.276Z","by":"qe-acceptance","verdict":"accept","reason":"All criteria met: 25/25 claims tests pass, lifecycle/PII/timers/checks/routes verified against contracts and openapi x-roles; module boots, sweepTimers exported"}],"firstPass":true}},{"status":"done","dependsOn":[],"createdAt":"2026-10-18T20:34:36.736Z","history":[ t":"S1-SEC-01","link":"architecture/threat-model.md"},{"at":"2026-10-18T20:37:01.876Z","hub":"architecture","type":"contract-change","text":"Contract vs core drift (security-relevant): openapi roles tenant_admin/auditor vs core ROLES carrier_admin/platform_admin/agent; JWT claim tid vs core tenantId; claimIds (claimant scoping) not carried by core tokens; token request userId/ttlMinutes vs core sub/ttlSeconds; envelope tenantId+source pattern vs bus tenantid,/fnol-platform; overview says ciphertext carries key version and tenant_keys table exists but crypto.mjs is HKDF from one master key (enc:v1 is format version, no key id). Proposed smallest additions: role alias map tenant_admin->carrier_admin + auditor role in core; claimIds claim; enc:v2:\u003ckeyId> format. Timer kind enum lacks 'pay' (compliance mapping documents pay deadlines as core-system owned; optional 'pay' kind proposed for v1.1)","from":"ic-security-threat-modeler","ticket":"S1-SEC-01","link":"docs/compliance-mapping.md"},{"at":"2026-10-18T20:37:54.556Z","hub":"architecture","type":"contract-change","text":"Roles drift: openapi x-roles use 'auditor' and 'tenant_admin' which src/core/auth.mjs ROLES lacks (has carrier_admin, agent); GET /audit registered roles [supervisor,carrier_admin,platform_admin] vs documented [auditor,tenant_admin,supervisor]; /health documented but core registers /healthz; /auth/me not registered; /auth/token body documented as userId/displayName but core takes sub/name. Security suite tracks these as todo tests.","from":"ic-security-authz-engineer","ticket":"S1-SEC-02"},{"at":"2026-10-18T20:41:02.091Z","hub":"architecture","type":"contract-change","text":"Coverage 1.1.0 (modules.md): adds seedPolicies(policies[]) -> {inserted} and getSnapshotById; mock table renamed mock_policies -> coverage_policies; CoverageVerification gains additive status/deductible/limits/applicableCoverages (schema has additionalProperties:false, please add them to CoverageVerification.schema.json); ticket status codes in_force|lapsed|excluded map onto outcome enum. REQUEST: bump module.contracts in org/contracts/registry.json to 1.1.0 (outside integrations paths).","from":"ic-integrations-mock-pas-dev","ticket":"S1-INT-01","link":"architecture/contracts/modules.md"},{"at":"2026-10-18T20:41:25.741Z","hub":"architecture","type":"contract-change","text":"POST /auth/token: openapi says userId/displayName and 201 {token,expiresAt,principal}; core reads sub/name and returns 200 {token,tokenType,claims}. devLogin sends both field sets; please align spec or core.","from":"ic-experience-ux-designer","ticket":"S1-EXP-01","link":"architecture/contracts/openapi.yaml"},{"at":"2026-10-18T20:42:04.342Z","hub":"architecture","type":"contract-change","text":"Domain PII marking gaps: common.Location.description (free text) and Location.geo (GeoPoint) are not x-pii but identify a person; propose marking both x-pii (additive). Logger REDACT misses dateOfBirth, injuryDescription, description, body, ip, 'licence' spelling (verified via redact()); see architecture/data-protection.md s2/s6","from":"ic-security-threat-modeler","ticket":"S1-SEC-01","link":"architecture/data-protection.md"},{"at":"2026-10-18T20:43:38.000Z","hub":"architecture","type":"contract-change","text":"config: core auth ROLES lacks tenant_admin and auditor named in openapi x-roles; config routes accept carrier_admin as tenant_admin equivalent. Also tenant_configs table is owned by core (ctx.tenants), so config has no own migration. TenantConfig.timers[].state is a UsState, so 'timers reference known states' is checked against LOB states plus stopOn.toStatus against lifecycle states.","from":"ic-workflow-domain-modeler","ticket":"S1-WFL-01"},{"at":"2026-10-18T20:44:36.873Z","hub":"architecture","type":"contract-change","text":"CSR portal: (1) openapi has no policy search route; using GET /policies/{policyNumber}/snapshot?asOf (exact lookup, 0-1 results). Request optional GET /policies?q= for real search. (2) IntakeStep gives only progress.requiredRemaining; request optional additive IntakeStep.missing[] ({questionId,text}); CSR derives from seen questions until then. (3) Channel enum has csr_phone, not 'csr'; CSR uses csr_phone. (4) shared api.post() ignores headers so Idempotency-Key needs a wrapper client (platform/experience kit).","from":"ic-experience-csr-portal-dev","ticket":"S1-EXP-03","link":"architecture/contracts/openapi.yaml"},{"at":"2026-10-18T20:45:39.593Z","hub":"architecture","type":"contract-change","text":"integrations: openapi x-roles use tenant_admin/auditor but ROLES in core auth has carrier_admin and no tenant_admin/auditor; webhook routes accept [tenant_admin, carrier_admin] so both work. Suggest aligning role names in openapi.yaml or core ROLES.","from":"ic-integrations-webhook-dev","ticket":"S1-INT-02","link":"architecture/contracts/openapi.yaml"},{"at":"2026-10-18T20:45:39.667Z","hub":"architecture","type":"contract-change","text":"integrations: core outbox table has no sequence column (modules.md says it does). GET /integrations/outbox derives sequence as 1-based position via ctx.bus.outbox and prefers a core 'sequence' field if added. Request: platform adds outbox.sequence (per-tenant monotonic) and a limit/after option on bus.outbox.","from":"ic-integrations-webhook-dev","ticket":"S1-INT-02","link":"architecture/contracts/modules.md"},{"at":"2026-10-18T20:50:24.580Z","hub":"architecture","type":"contract-change","text":"rules 1.0 clarifications: (1) validateRules and evaluateCondition are synchronous (config needs sync); evaluate/route/buildFacts/getRoutingDecision async. (2) Routing precedence: first route_queue in ascending priority wins (seeded priority-90 default rules would otherwise override injury/SIU); approved fast track beats default queues; deny_fast_track beats fast_track; fast track also requires coverage.outcome=covered and tenant fastTrack limits. (3) additive route() opts sourceEventId/auto and service fn onClaimTriaged(evt); routing_decisions gains seq, source_event_id, actions, actions_done. (4) answers fact comes from intake.getSession(claim.intakeSessionId).answers when available, else claim.answers. Please update modules.md domain-model.md section 4 'last route_queue wins'.","from":"ic-workflow-rules-engine-dev","ticket":"S1-WFL-02","link":"src/modules/rules/"},{"at":"2026-10-18T20:53:13.539Z","hub":"architecture","type":"contract-change","text":"AdjusterView schema has no header/flags/nextBestActions keys (additionalProperties:false). Implemented as claim (header) with derived flags merged into claim.flags, and nextActions (items also carry priority, source). ai.run returns tier as AiProvenance integer (0 local,1 cheap,2 strong) plus tierName; tenant comes from opts.tenantId (ctx.ai is root-bound) or ai.forTenant(id). Task 'next_question' (intake/openapi) is not one of the 8 tasks and throws validation_error. adjuster_inbox gains additive columns claim_number, lob, complexity, next_timer, reported_at.","from":"ic-ai-summarization-engineer","ticket":"S1-AI-01"},{"at":"2026-10-18T20:53:20.951Z","hub":"architecture","type":"contract-change","text":"claims: additive event claim.updated {claimId, change, version, ...ids} published for mutations with no dedicated event (flag, task, external ref, reserve, routing/checks/triage updates from events, timer started/met/cancelled). Also service additions applyEvent/applyTimerEvent/sweepTimers(now). Seeded onBreach add_task type timer_breach_followup and stopOn taskType acknowledge_claimant are outside the Task.type enum: stored as 'other' with the requested type kept for timer matching.","from":"ic-workflow-timers-dev","ticket":"S1-WFL-03","link":"src/modules/claims/service.mjs"},{"at":"2026-10-18T20:54:26.974Z","hub":"architecture","type":"contract-change","text":"evidence: (1) Document.extraction gains optional boolean needsReview (status 'partial' + needsReview=true for unreadable PDFs / low-confidence photos). (2) openapi x-roles lists 'auditor' bu <script>// PMO dashboard UI. Data comes from /api/snapshot + /api/metrics, or window.__SNAPSHOT__ in the exported file.
(function () {
  const TABS = ['Overview', 'Org chart', 'Sprint board', 'Velocity & forecast', 'Quality', 'Flow', 'Cost', 'Performance', 'Sprint review', 'Value drivers', 'Improvement log'];
  const STATUSES = ['backlog', 'ready', 'in_progress', 'review', 'done', 'blocked'];
  const state = { tab: 0, team: '', data: null, error: null };
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v) ? 'n/a' : typeof v === 'number' ? String(Math.round(v * 10 ** d) / 10 ** d) : esc(v));
  const pct = (v) => (v === null || v === undefined ? 'n/a' : Math.round(v * 1000) / 10 + '%');
  const usd = (v) => (v === null || v === undefined ? 'n/a' : '$' + Number(v).toFixed(2));
  const kpi = (l, v, cls) => `<div class="card kpi"><div class="l">${esc(l)}</div><div class="v ${cls || ''}">${v}</div></div>`;
  const badge = (s) => `<span class="badge ${esc(s)}">${esc(s)}</span>`;
  const empty = (t) => `<div class="empty">${esc(t)}</div>`;
  const table = (heads, rows) => rows.length
    ? `<div class="scroll"><table><thead><tr>${heads.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : empty('No data yet.');

  // ---- charts (inline SVG) ----
  function barChart(rows) {
    if (!rows.length) return empty('No sprints yet.');
    const W = 480, H = 220, p = { l: 36, r: 8, t: 10, b: 28 };
    const max = Math.max(1, ...rows.flatMap((r) => [r.committed, r.completed]));
    const bw = (W - p.l - p.r) / rows.length;
    const y = (v) => H - p.b - (v / max) * (H - p.t - p.b);
    const bars = rows.map((r, i) => {
      const x = p.l + i * bw + bw * 0.12, w = bw * 0.36;
      return `<rect class="s1" x="${x}" y="${y(r.committed)}" width="${w}" height="${H - p.b - y(r.committed)}" opacity=".55"><title>Sprint ${esc(r.sprint)} committed ${r.committed}</title></rect>
        <rect class="s2" x="${x + w + 2}" y="${y(r.completed)}" width="${w}" height="${H - p.b - y(r.completed)}"><title>Sprint ${esc(r.sprint)} completed ${r.completed}</title></rect>
        <text x="${x + w}" y="${H - 10}" text-anchor="middle">S${esc(r.sprint)}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Committed vs completed points per sprint"><line class="axis" x1="${p.l}" x2="${W - p.r}" y1="${H - p.b}" y2="${H - p.b}"/>
      <text x="${p.l - 4}" y="${y(max) + 4}" text-anchor="end">${max}</text><text x="${p.l - 4}" y="${H - p.b}" text-anchor="end">0</text>${bars}</svg>
      <div class="legend"><i class="s1" style="opacity:.55"></i>committed<i class="s2"></i>completed</div>`;
  }
  function lineChart(series, key, committed) {
    if (!series.length) return empty('No burndown data yet.');
    const W = 480, H = 220, p = { l: 36, r: 12, t: 10, b: 28 };
    const t = series.map((s) => Date.parse(s.at));
    const t0 = Math.min(...t), t1 = Math.max(...t, t0 + 1);
    const max = Math.max(1, committed, ...series.map((s) => s[key]));
    const x = (v) => p.l + ((v - t0) / (t1 - t0)) * (W - p.l - p.r);
    const y = (v) => H - p.b - (v / max) * (H - p.t - p.b);
    const pts = series.map((s, i) => `${x(t[i]).toFixed(1)},${y(s[key]).toFixed(1)}`).join(' ');
    const dots = series.map((s, i) => `<circle class="s1" r="3" cx="${x(t[i])}" cy="${y(s[key])}"><title>${esc(s.at)}: ${s[key]}${s.ticket ? ' (' + esc(s.ticket) + ')' : ''}</title></circle>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(key)} over time"><line class="axis" x1="${p.l}" x2="${W - p.r}" y1="${H - p.b}" y2="${H - p.b}"/>
      <line class="ideal" x1="${x(t0)}" y1="${y(committed)}" x2="${x(t1)}" y2="${y(0)}"/>
      <polyline class="line s1" points="${pts}"/>${dots}<text x="${p.l - 4}" y="${y(max) + 4}" text-anchor="end">${max}</text><text x="${p.l - 4}" y="${H - p.b}" text-anchor="end">0</text>
      <text x="${p.l}" y="${H - 10}">${esc(new Date(t0).toLocaleDateString())}</text><text x="${W - p.r}" y="${H - 10}" text-anchor="end">${esc(new Date(t1).toLocaleDateString())}</text></svg>`;
  }
  const hbars = (obj, fmtFn) => {
    const e = Object.entries(obj || {});
    if (!e.length) return empty('No data yet.');
    const max = Math.max(1e-9, ...e.map(([, v]) => v));
    return `<svg viewBox="0 0 480 ${e.length * 24 + 6}" role="img">${e.map(([k, v], i) => `<text x="0" y="${i * 24 + 16}">${esc(k)}</text><rect class="s1" x="110" y="${i * 24 + 5}" width="${(v / max) * 280}" height="14" rx="2"/><text x="${116 + (v / max) * 280}" y="${i * 24 + 16}">${esc(fmtFn(v))}</text>`).join('')}</svg>`;
  };

  function tierMix(mix) {
    const tiers = (mix && mix.tiers) || [];
    if (!tiers.length || !mix.totalUsd) return empty('No tier spend yet.');
    return `<div class="stack" role="img" aria-label="Spend share by model tier">${tiers.filter((t) => t.pct > 0).map((t, i) => `<span class="seg c${i % 4}" style="width:${t.pct}%" title="${esc(t.tier)} ${t.pct}%"></span>`).join('')}</div>`
      + table(['Tier', 'Spend', 'Share', 'Tickets', 'Points'], tiers.map((t) => [esc(t.tier), usd(t.usd), t.pct + '%', t.tickets, t.points]));
  }
  const list = (a) => (Array.isArray(a) && a.length ? `<ul>${a.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="muted">None recorded.</p>');

  // ---- views ----
  const views = [
    function overview({ snapshot: s, metrics: m }) {
      const t = m.tickets, c = m.cost;
      const targets = m.targets.length ? table(['Target', 'Actual', 'Target value', 'Status'], m.targets.map((x) => [esc(x.name), fmt(x.actual), fmt(x.target), badge(x.status)])) : empty('No targets configured.');
      return `<div class="grid">${kpi('Tickets', t.total)}${kpi('Done points', `${t.donePoints}/${t.totalPoints}`)}${kpi('WIP', m.wip)}${kpi('Velocity', fmt(m.velocity) + ' pts')}
        ${kpi('Forecast', m.forecast.sprintsRemaining === null ? 'n/a' : m.forecast.sprintsRemaining + ' sprints')}${kpi('Spend', usd(c.totalUsd))}${kpi('Budget left', usd(c.budgetRemainingUsd))}${kpi('Blocked', t.byStatus.blocked || 0, (t.byStatus.blocked || 0) ? 'bad' : '')}</div>
        <div class="card"><h2>Targets${m.currentSprint !== null ? ' (sprint ' + esc(m.currentSprint) + ')' : ''}</h2>${targets}</div>`;
    },
    function org({ snapshot: s }) {
      const teams = (s.teams && s.teams.teams) || [];
      if (!teams.length) return empty('No teams defined (org/teams.json).');
      const inprog = (s.tickets || []).filter((t) => t.status === 'in_progress');
      const head = s.teams.orchestrator ? `<div class="card team"><h2>${esc(s.teams.orchestrator.title || s.teams.orchestrator.id)}</h2><p class="muted">${esc(s.teams.orchestrator.id)} · ${esc(s.teams.orchestrator.model)}</p></div>` : '';
      return head + `<div class="grid wide">${teams.map((t) => {
        const mine = (s.tickets || []).filter((x) => x.team === t.id);
        const active = inprog.filter((x) => x.team === t.id);
        return `<div class="card"><h2>${esc(t.name)}</h2><p class="muted">Director ${esc(t.director && t.director.id)} · Manager ${esc(t.manager && t.manager.id)}</p>
          <h3>Active ICs (${active.length})</h3>${active.length ? `<ul class="plain">${active.map((x) => `<li><b>${esc(x.owner)}</b> on ${esc(x.id)}</li>`).join('')}</ul>` : '<p class="muted">None active</p>'}
          <h3>Assignments (${mine.length})</h3>${mine.length ? `<ul class="plain">${mine.map((x) => `<li>${esc(x.id)} ${badge(x.status)} <span class="muted">${esc(x.owner)}</span></li>`).join('')}</ul>` : '<p class="muted">No tickets</p>'}
          <p class="muted">IC roles: ${esc((t.icRoles || []).join(', '))}</p></div>`;
      }).join('')}</div>`;
    },
    function board({ snapshot: s }) {
      const all = s.tickets || [];
      if (!all.length) return empty('No tickets yet.');
      const teams = [...new Set(all.map((t) => t.team))];
      const list = all.filter((t) => !state.team || t.team === state.team);
      return `<div class="filters"><label>Team <select id="teamsel"><option value="">All</option>${teams.map((t) => `<option ${t === state.team ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label></div>
        <div class="board">${STATUSES.map((st) => {
          const cards = list.filter((t) => t.status === st);
          return `<div class="col"><h3>${esc(st.replace('_', ' '))} (${cards.length})</h3>${cards.map((t) => `<div class="tk ${st === 'blocked' ? 'blocked' : ''}"><b>${esc(t.id)}</b>${esc(t.title)}<div class="m">${esc(t.owner)} · ${esc(t.points)} pt · ${esc(t.team)}${(t.dependsOn || []).length && st !== 'done' ? ' · deps: ' + esc(t.dependsOn.join(', ')) : ''}</div></div>`).join('') || '<p class="muted">-</p>'}</div>`;
        }).join('')}</div>`;
    },
    function velocity({ metrics: m }) {
      return `<div class="grid wide"><div class="card"><h2>Committed vs completed</h2>${barChart(m.sprintPoints)}</div>
        <div class="card"><h2>Burndown (remaining points)</h2>${lineChart(m.burndown, 'remaining', m.committed)}</div>
        <div class="card"><h2>Burnup (completed points)</h2>${lineChart(m.burnup, 'completed', m.committed)}</div></div>
        <div class="card"><h2>Forecast</h2><p>${esc(m.forecast.text)}</p><p class="muted">Rolling average velocity: ${fmt(m.velocity)} points per sprint.</p></div>`;
    },
    function quality({ metrics: m }) {
      const q = m.quality;
      return `<div class="grid">${kpi('Tests passed', q.testsTotal === null ? 'n/a' : `${q.testsPassed}/${q.testsTotal}`)}${kpi('Test pass rate', pct(q.testPassRate))}${kpi('Coverage', q.coveragePct === null ? 'n/a' : fmt(q.coveragePct) + '%')}
        ${kpi('Build', q.buildGreen === null ? 'n/a' : q.buildGreen ? 'green' : 'red', q.buildGreen === null ? '' : q.buildGreen ? 'good' : 'bad')}${kpi('Defect escape', pct(q.defectEscapeRate))}${kpi('Rework rate', pct(q.rework ?? q.reworkRate))}${kpi('First-pass', pct(q.firstPassAcceptance))}</div>
        <p class="muted">${q.at ? 'Test results from ' + esc(q.at) : 'No org/quality.json yet. Run node dashboard/quality-report.mjs.'}</p>`;
    },
    function flow({ metrics: m }) {
      const rows = Object.entries(m.flow.perTeam).map(([t, v]) => [esc(t), fmt(v.cycleHours), fmt(v.leadHours), v.samples]);
      const sd = m.serialDependencies;
      return `<div class="grid">${kpi('WIP', m.wip)}${kpi('Avg cycle (h)', fmt(m.flow.cycleHours))}${kpi('Avg lead (h)', fmt(m.flow.leadHours))}${kpi('Synapse latency (min)', fmt(m.synapse.avgMinutes))}${kpi('Unanswered requests', m.synapse.unanswered)}${kpi('Serial deps open', sd.count, sd.count ? 'warn' : '')}</div>
        <div class="card"><h2>Cycle and lead time per team</h2>${table(['Team', 'Cycle (h)', 'Lead (h)', 'Done tickets'], rows)}</div>
        ${sd.count ? `<p class="muted">Blocked by dependencies: ${esc(sd.ids.join(', '))}</p>` : ''}`;
    },
    function cost({ metrics: m }) {
      const c = m.cost;
      return `<div class="grid">${kpi('Total spend', usd(c.totalUsd))}${kpi('Budget', usd(c.budgetUsd))}${kpi('Remaining', usd(c.budgetRemainingUsd))}${kpi('Used', c.budgetUsedPct === null ? 'n/a' : c.budgetUsedPct + '%')}${kpi('Points per $', fmt(c.pointsPerDollar))}</div>
        <div class="grid wide"><div class="card"><h2>By team</h2>${hbars(c.byTeam, usd)}</div><div class="card"><h2>By sprint</h2>${hbars(c.bySprint, usd)}</div><div class="card"><h2>By ticket</h2>${hbars(c.byTicket, usd)}</div>
        <div class="card"><h2>Model tier mix</h2>${tierMix(m.tierMix)}</div></div>`;
    },
    function performance({ metrics: m }) {
      const sc = m.scorecards || { agents: [], teams: [] };
      if (!(sc.agents || []).length && !(sc.teams || []).length) return empty('No scorecards yet (org/scorecards/latest.json).');
      const row = (r) => [esc(r.key || r.id || r.agent || r.team || r.name), fmt(r.composite), r.tickets ?? r.ticketCount ?? r.ticketsDone ?? 'n/a',
        (r.lowPerformerFlag ? '<span class="badge off-track">low performer</span>' : '') + (r.lowConfidence ? ' <span class="badge">low confidence</span>' : '') || '-', esc((r.diagnosis || []).join('; '))];
      return `<div class="grid wide"><div class="card"><h2>Agents</h2>${table(['Agent', 'Composite', 'Tickets', 'Flags', 'Diagnosis'], (sc.agents || []).map(row))}</div>
        <div class="card"><h2>Teams</h2>${table(['Team', 'Composite', 'Tickets', 'Flags', 'Diagnosis'], (sc.teams || []).map(row))}</div></div>
        <p class="muted">Fewer than 3 tickets means low confidence; no action is taken on those rows.</p>`;
    },
    function sprintReview({ metrics: m }) {
      const rs = m.sprintReviews || [];
      if (!rs.length) return empty('No sprints yet.');
      return rs.map((s) => {
        const r = s.review;
        const kp = r ? `<div class="grid">${kpi('Points', `${fmt(r.completedPoints)}/${fmt(r.committedPoints)}`)}${kpi('Spend', usd(r.usd))}${kpi('Points per $', fmt(r.pointsPerDollar))}${kpi('First-pass', pct(r.firstPassAcceptance))}${kpi('Rework', pct(r.reworkRate))}${kpi('Tests', r.testsPassed ?? pct(r.testPassRate))}</div>
          ${list(r.shipped).replace('<ul>', '<h3>Shipped</h3><ul>')}` : '<p class="muted">Review not written yet.</p>';
        const t = s.retro;
        const retro = t ? `<div class="grid wide"><div><h3>Went well</h3>${list(t.went_well)}</div><div><h3>Went badly</h3>${list(t.went_badly)}</div><div><h3>Manager retros</h3>${list(t.manager_retros)}</div></div>` : '<p class="muted">No retro yet.</p>';
        return `<div class="card"><h2>${esc(s.name)} ${badge(s.status)}</h2>${s.goal ? `<p class="muted">${esc(s.goal)}</p>` : ''}${kp}${retro}</div>`;
      }).join('');
    },
    function valueDrivers({ metrics: m }) {
      const vd = m.valueDrivers || [];
      if (!vd.length) return empty('No value drivers found (product/value-propositions.md).');
      return `<div class="grid wide">${vd.map((d) => `<div class="card"><h2>${esc(d.id)}</h2><p>${esc(d.title)}</p>
        <p class="muted">${d.tickets.length} ticket(s) · ${d.donePoints}/${d.points} pts done</p>
        ${d.tickets.length ? `<ul class="plain">${d.tickets.map((t) => `<li><b>${esc(t.id)}</b> ${badge(t.status)} <span class="muted">${esc(t.title)}</span></li>`).join('')}</ul>` : '<p class="muted">No linked tickets yet.</p>'}</div>`).join('')}</div>`;
    },
    function improvements({ metrics: m, snapshot: s }) {
      const l = m.improvements || (Array.isArray(s.improvements) ? s.improvements : []);
      return `<div class="card"><h2>Improvement log</h2>${table(['Hypothesis', 'Owner', 'Metric', 'Before', 'After', 'Target', 'Result'],
        l.map((i) => [esc(i.hypothesis), esc(i.owner), esc(i.metric), fmt(i.before), fmt(i.after), fmt(i.target), esc(i.result ?? i.status)]))}</div>`;
    },
  ];

  function render() {
    $('tabs').innerHTML = TABS.map((t, i) => `<button role="tab" aria-selected="${i === state.tab}" data-i="${i}">${esc(t)}</button>`).join('');
    const d = state.data;
    if (!d) { $('view').innerHTML = empty(state.error ? 'Cannot load data: ' + state.error : 'Loading…'); return; }
    $('program').textContent = (d.snapshot.config && d.snapshot.config.program) || 'Program Dashboard';
    $('meta').textContent = 'Generated ' + (d.snapshot.generatedAt || 'n/a');
    $('live').textContent = state.error ? 'stale' : window.__SNAPSHOT__ ? 'snapshot' : 'live';
    $('live').className = 'pill' + (state.error ? ' stale' : '');
    try { $('view').innerHTML = views[state.tab](d); } catch (e) { $('view').innerHTML = empty('Render error: ' + e.message); }
    const sel = $('teamsel'); if (sel) sel.onchange = () => { state.team = sel.value; render(); };
  }

  async function load() {
    if (window.__SNAPSHOT__) { state.data = window.__SNAPSHOT__; render(); return; }
    try {
      const [snapshot, metrics] = await Promise.all(['/api/snapshot', '/api/metrics'].map((u) => fetch(u).then((r) => { if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); })));
      state.data = { snapshot, metrics }; state.error = null;
    } catch (e) { state.error = e.message; }
    render();
  }

  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { state.tab = Number(b.dataset.i); render(); } });
  render();
  load();
  if (!window.__SNAPSHOT__) setInterval(load, 10000);
})();
</script>
</body>
</html>
